<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0c0a">
<title>صفحتي | شعيب استوديو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="supabase-config.js"></script>
<style>
:root{
  --bg:#0e0c0a;--card:#1a1613;--card2:#221d19;--line:#332b22;--line2:#4a3d2f;
  --gold:#c9a463;--gold2:#e3c98a;--gold3:#8a703f;--text:#efe6d8;--muted:#a89b87;
  --ok:#86c49a;--warn:#e6b85c;--bad:#ec8a7d;--r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(900px 480px at 50% -12%,rgba(201,164,99,.17),transparent 62%),var(--bg);
  color:var(--text);font-family:'Tajawal',system-ui,sans-serif;line-height:1.65;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
a{color:var(--gold2)}
.wrap{max-width:680px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 120px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 20px}
.logo{font-family:'Aref Ruqaa',serif;font-size:30px;line-height:1;color:var(--gold2);text-shadow:0 0 26px rgba(201,164,99,.28);letter-spacing:.5px}
html[lang="en"] .logo{font-family:'Playfair Display',serif;font-size:24px;letter-spacing:1px}
.ghost{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.ghost:hover{color:var(--gold2);border-color:var(--gold3)}

/* hello */
.hello h1{margin:0;font-size:clamp(24px,6vw,32px);font-weight:800;letter-spacing:-.01em}
.hello h1 span{color:var(--gold2)}
.hello p{margin:4px 0 0;color:var(--muted);font-size:15px}
.rule{height:1px;margin:22px 0;background:linear-gradient(90deg,transparent,var(--gold3),transparent)}

/* cards */
.card{background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 18px 40px -26px #000}
.card.gold{border-color:rgba(201,164,99,.45);background:linear-gradient(165deg,#2a2219,#1a1511)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.sec h2{margin:0;font-size:18px;font-weight:800}
.sec small{color:var(--muted);font-size:13px}
.kicker{font-size:12px;letter-spacing:.08em;color:var(--gold);font-weight:700}
html[lang="ar"] .kicker{letter-spacing:0}
.muted{color:var(--muted)}

/* next shoot */
.next{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.datebox{width:84px;height:92px;border-radius:18px;border:1px solid var(--gold3);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(201,164,99,.07)}
.datebox b{font-family:'Playfair Display',serif;font-size:38px;line-height:1;color:var(--gold2)}
.datebox span{font-size:12px;color:var(--muted);margin-top:4px}
.next h3{margin:2px 0 4px;font-size:19px}
.next .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.count{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:999px;background:var(--gold);color:#1a140c;font-weight:800;font-size:13px}

/* summary chips */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chip{border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(255,255,255,.02);min-width:0}
.chip span{display:block;font-size:12px;color:var(--muted)}
.chip b{font-size:19px;font-weight:800;direction:ltr;display:inline-block}
.chip b.due{color:var(--bad)}.chip b.ok{color:var(--ok)}

/* alert */
.alert{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:16px;border:1px solid rgba(230,184,92,.45);background:rgba(230,184,92,.09);margin-top:14px;font-weight:700;font-size:14px}

/* project + stepper */
.ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph h3{margin:0;font-size:17px}
.ph .meta{font-size:13px;color:var(--muted);margin-top:2px}
.steps{list-style:none;padding:0;margin:18px 0 6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.steps:before{content:"";position:absolute;top:11px;inset-inline:10%;height:2px;background:var(--line2)}
.steps .bar{position:absolute;top:11px;inset-inline-start:10%;height:2px;background:linear-gradient(90deg,var(--gold3),var(--gold));transition:width .6s}
.steps li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:11.5px;color:var(--muted);line-height:1.3;padding:0 2px}
.steps i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px;z-index:1}
.steps li.done i{background:var(--gold);border-color:var(--gold);color:#1a140c;font-weight:800}
.steps li.done{color:var(--text)}
.steps li.cur i{background:var(--bg);border-color:var(--gold2);box-shadow:0 0 0 5px rgba(201,164,99,.18);animation:pulse 2s infinite}
.steps li.cur{color:var(--gold2);font-weight:800}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(201,164,99,.06)}}
.dline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a140c;box-shadow:0 10px 24px -12px rgba(201,164,99,.7)}
.btn-line{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn-line:hover{border-color:var(--gold3)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%}
.gal-wait{font-size:13px;color:var(--muted);border:1px dashed var(--line2);border-radius:12px;padding:8px 12px}

/* status pills */
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-ok{background:rgba(134,196,154,.14);color:var(--ok)}
.p-warn{background:rgba(230,184,92,.14);color:var(--warn)}
.p-bad{background:rgba(236,138,125,.14);color:var(--bad)}
.p-mute{background:rgba(255,255,255,.06);color:var(--muted)}

/* money rows */
.rows{margin-top:12px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04)}
.row b{direction:ltr}
.row.big{font-size:17px;font-weight:800;border-bottom:0;padding-top:10px}
.row.big b{color:var(--gold2)}
.row.rem b{color:var(--bad)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--gold2);font-size:14px;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:" ▾"}
details[open] summary:after{content:" ▴"}
.items{margin:8px 0 0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.items li b{direction:ltr;white-space:nowrap}
.items small{color:var(--muted)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts .btn{flex:1 1 140px}
.note{margin-top:10px;font-size:13px;color:var(--muted);white-space:pre-line}

/* pin */
.center{min-height:72vh;display:flex;align-items:center;justify-content:center}
.pinbox{width:min(380px,100%);text-align:center}
.pins{display:flex;gap:10px;justify-content:center;direction:ltr;margin:18px 0 6px}
.pins input{width:58px;height:66px;border-radius:16px;border:1px solid var(--line2);background:#15110e;text-align:center;font-size:28px;font-weight:800;outline:none;caret-color:var(--gold)}
.pins input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,164,99,.15)}
.err{color:var(--bad);min-height:24px;font-size:14px;font-weight:700}

/* skeleton */
.sk{border-radius:16px;background:linear-gradient(90deg,#1a1613 25%,#241e19 50%,#1a1613 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:14px}
@keyframes sh{to{background-position:-200% 0}}

/* contact + fab */
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}
.foot .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.fab{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));inset-inline-end:18px;z-index:20;border-radius:999px;padding:13px 20px;background:#22b85f;color:#fff;font-weight:800;text-decoration:none;box-shadow:0 14px 30px -10px rgba(34,184,95,.6);display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:30;background:var(--card2);border:1px solid var(--gold3);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:90vw;text-align:center;box-shadow:0 20px 40px -14px #000}
.toast[hidden]{display:none}
.empty{text-align:center;color:var(--muted);padding:18px;font-size:14px}

/* printable invoice / quotation */
#print{display:none}
@media print{
  body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#111;font-family:'Tajawal',sans-serif}
}
.pdoc{max-width:760px;margin:0 auto;padding:28px}
.pdoc .ph1{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b8893f;padding-bottom:14px}
.pdoc .brand{font-family:'Aref Ruqaa',serif;font-size:30px;color:#8a6526}
.pdoc .co{font-size:12px;color:#555;margin-top:4px}
.pdoc h2{margin:0;font-size:20px;color:#8a6526;text-align:end}
.pdoc table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}
.pdoc th{background:#f3ead8;color:#5a4318;text-align:start;padding:8px}
.pdoc td{padding:8px;border-bottom:1px solid #eee}
.pdoc .n{text-align:end;direction:ltr;white-space:nowrap}
.pdoc tfoot td{font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:420px){.sum{grid-template-columns:1fr 1fr}.sum .chip:last-child{grid-column:1/-1}.steps li{font-size:10.5px}.next{grid-template-columns:1fr}.datebox{width:100%;height:auto;flex-direction:row;gap:10px;padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo" id="logo">شعيب استوديو</div><button class="ghost" id="langBtn" type="button">English</button></div>
  <main id="app"><div class="sk" style="height:70px"></div><div class="sk" style="height:140px"></div><div class="sk" style="height:220px"></div></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="print"></div>

<script>
(()=>{
const SB=window.SB||{};
const tok=(location.hash.match(/c=([\w-]{20,})/)||[])[1]||'';
const PK='pt_pin_'+tok.slice(0,10);
let lang='ar';try{lang=localStorage.getItem('pt_lang')||'ar'}catch(e){}
let D=null,PIN='',PNM='',PER='';

const L={
ar:{cur:'د.ب',hello:'أهلًا',sub:'صفحتك الخاصة لمتابعة حجوزاتك وفواتيرك وصورك.',next:'جلستك القادمة',today:'اليوم',tomorrow:'غدًا',inDays:'بعد {n} يوم',
 due:'المتبقي عليك',allPaid:'لا شيء مستحق',projects:'مشاريعي',galleries:'معارض جاهزة',invoices:'الفواتير',quotes:'عروض الأسعار',
 noProjects:'لا توجد حجوزات بعد.',noInv:'لا توجد فواتير بعد.',delivery:'التسليم المتوقع',gallery:'مشاهدة الصور',galleryWait:'سيظهر رابط الصور هنا عند جاهزيتها ✨',
 total:'الإجمالي',paid:'المدفوع',rem:'المتبقي',subtotal:'المجموع الفرعي',disc:'الخصم',vat:'ضريبة القيمة المضافة',details:'تفاصيل البنود',print:'طباعة / PDF',
 approve:'أوافق على العرض',reject:'لا، شكرًا',validUntil:'صالح حتى',issued:'التاريخ',dueDate:'الاستحقاق',
 st_paid:'مدفوعة',st_part:'دفعة جزئية',st_unpaid:'غير مدفوعة',st_over:'متأخرة',q_sent:'بانتظار موافقتك',q_approved:'تمت الموافقة',q_rejected:'مرفوض',
 pendingQ:'لديك عرض سعر بانتظار موافقتك',view:'عرض',pinTitle:'رمز الدخول',pinSub:'أدخل آخر 4 أرقام من رقم هاتفك',pinBad:'الرمز غير صحيح، حاول مرة أخرى',
 locked:'محاولات كثيرة — حاول بعد 15 دقيقة',enter:'دخول',invalid:'هذا الرابط غير صالح أو تم إيقافه. تواصل مع الاستوديو للحصول على رابط جديد.',
 net:'تعذّر الاتصال. تحقق من الإنترنت وحاول مرة أخرى.',retry:'إعادة المحاولة',contact:'تواصل معنا',updated:'آخر تحديث',
 confirmApprove:'تأكيد الموافقة على عرض السعر؟',approvedMsg:'شكرًا! وصلت موافقتك وسنتواصل معك لتأكيد الحجز والعربون 🤍',
 rejectAsk:'يسعدنا نعرف السبب لنخدمك أفضل (اختياري):',rejectedMsg:'وصل ردك، شكرًا لك.',stateErr:'تم الرد على هذا العرض مسبقًا.',
 stages:['محجوز','تم التصوير','التعديل والمونتاج','جاهز للتسليم','تم التسليم'],config:'لم يتم إعداد البوابة بعد.',other:'English',
 invoice:'فاتورة',quotation:'عرض سعر',taxInv:'فاتورة ضريبية',billTo:'إلى',desc:'الوصف',qty:'الكمية',price:'السعر',line:'المجموع',waHi:'مرحبًا، أنا {n} 👋',insta:'إنستغرام',whatsapp:'واتساب'},
en:{cur:'BHD',hello:'Hello',sub:'Your private page for bookings, invoices and photos.',next:'Your next session',today:'Today',tomorrow:'Tomorrow',inDays:'In {n} days',
 due:'Balance due',allPaid:'Nothing due',projects:'My projects',galleries:'Ready galleries',invoices:'Invoices',quotes:'Quotations',
 noProjects:'No bookings yet.',noInv:'No invoices yet.',delivery:'Expected delivery',gallery:'View photos',galleryWait:'Your gallery link will appear here when it\'s ready ✨',
 total:'Total',paid:'Paid',rem:'Balance',subtotal:'Subtotal',disc:'Discount',vat:'VAT',details:'Line items',print:'Print / PDF',
 approve:'Accept quotation',reject:'No, thanks',validUntil:'Valid until',issued:'Date',dueDate:'Due',
 st_paid:'Paid',st_part:'Partly paid',st_unpaid:'Unpaid',st_over:'Overdue',q_sent:'Awaiting your reply',q_approved:'Accepted',q_rejected:'Declined',
 pendingQ:'A quotation is waiting for your reply',view:'View',pinTitle:'Access code',pinSub:'Enter the last 4 digits of your phone number',pinBad:'Wrong code, please try again',
 locked:'Too many attempts — try again in 15 minutes',enter:'Enter',invalid:'This link is invalid or has been turned off. Please contact the studio for a new link.',
 net:'Couldn\'t connect. Check your internet and try again.',retry:'Try again',contact:'Contact us',updated:'Last updated',
 confirmApprove:'Confirm you accept this quotation?',approvedMsg:'Thank you! We received your approval and will contact you to confirm the booking and deposit 🤍',
 rejectAsk:'Would you tell us why, so we can serve you better? (optional)',rejectedMsg:'Your reply was sent, thank you.',stateErr:'This quotation was already answered.',
 stages:['Booked','Shot','Editing','Ready','Delivered'],config:'The portal isn\'t set up yet.',other:'عربي',
 invoice:'Invoice',quotation:'Quotation',taxInv:'Tax invoice',billTo:'To',desc:'Description',qty:'Qty',price:'Price',line:'Total',waHi:'Hi, this is {n} 👋',insta:'Instagram',whatsapp:'WhatsApp'}};
const T=k=>(L[lang]||L.ar)[k];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f3=x=>(+x||0).toFixed(3);
const money=x=>`${f3(x)} <small>${T('cur')}</small>`;
const loc=()=>lang==='ar'?'ar-BH-u-nu-latn':'en-GB';
const pd=d=>new Date(d+'T00:00');
const fD=(d,o)=>d?pd(d).toLocaleDateString(loc(),o||{day:'numeric',month:'long',year:'numeric'}):'—';
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=d=>Math.round((pd(d)-pd(todayISO()))/864e5);
const safeUrl=u=>/^https:\/\/[^\s"'<>]+$/i.test(String(u||'').trim())?String(u).trim():'';
const STG=['booked','shot','editing','ready','delivered'];
function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4200)}

async function rpc(fn,body){
  const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent=T('other');
  const nm=D&&D.studio&&D.studio.name||'';
  $('logo').textContent=lang==='ar'&&(!nm||/shuaib/i.test(nm))?'شعيب استوديو':(nm||'Shuaib Studio');
  document.title=(lang==='ar'?'صفحتي':'My page')+' | '+$('logo').textContent;
}
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('pt_lang',lang)}catch(e){}applyLang();D?render():null;if(!D&&$('pinForm'))pinScreen(PNM,PER)};

function msgScreen(text,retry){
  $('app').innerHTML=`<div class="center"><div class="card" style="text-align:center;max-width:420px"><div style="font-size:40px;margin-bottom:6px">${retry?'📶':'🔒'}</div><p style="margin:0 0 14px">${esc(text)}</p>${retry?`<button class="btn btn-gold" id="retry">${T('retry')}</button>`:''}</div></div>`;
  if(retry)$('retry').onclick=()=>load(PIN);
}
function pinScreen(name,err){
  PNM=name;PER=err;
  $('app').innerHTML=`<div class="center"><form class="card gold pinbox" id="pinForm" autocomplete="off">
    <div class="kicker">${T('pinTitle')}</div><h1 style="margin:6px 0 2px;font-size:24px">${T('hello')}${name?' '+esc(name):''} 👋</h1>
    <p class="muted" style="margin:0">${T('pinSub')}</p>
    <div class="pins">${[0,1,2,3].map(i=>`<input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${i+1}" data-p="${i}">`).join('')}</div>
    <div class="err" role="alert">${err==='locked'?T('locked'):err?T('pinBad'):''}</div>
    <button class="btn btn-gold full" type="submit">${T('enter')}</button></form></div>`;
  const ins=[...document.querySelectorAll('[data-p]')];ins[0].focus();
  ins.forEach((el,i)=>{
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value))$('pinForm').requestSubmit()});
    el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus()});
    el.addEventListener('paste',e=>{const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(v.length===4){e.preventDefault();ins.forEach((x,j)=>x.value=v[j]);$('pinForm').requestSubmit()}});
  });
  $('pinForm').onsubmit=e=>{e.preventDefault();const v=ins.map(x=>x.value).join('');if(v.length===4)load(v)};
}

async function load(pin){
  applyLang();
  if(!tok)return msgScreen(T('invalid'));
  if(!SB.url||!SB.key)return msgScreen(T('config'));
  let r;
  try{r=await rpc('portal_get',{t:tok,p:pin||null})}catch(e){return msgScreen(T('net'),true)}
  if(r&&r.error){
    try{sessionStorage.removeItem(PK)}catch(e){}
    if(r.error==='pin')return pinScreen(r.name,pin?'bad':'');
    if(r.error==='locked')return pinScreen(r.name,'locked');
    return msgScreen(T('invalid'));
  }
  D=r;PIN=pin||'';try{if(PIN)sessionStorage.setItem(PK,PIN)}catch(e){}
  applyLang();render();
}

// ── render ──
function stepper(stage){
  const k=Math.max(0,STG.indexOf(stage)),w=k/(STG.length-1)*80;
  return `<ol class="steps" aria-label="progress"><span class="bar" style="width:${w}%"></span>${T('stages').map((l,i)=>`<li class="${i<k||stage==='delivered'?'done':i===k?'cur':''}"><i>${i<k||stage==='delivered'?'✓':i+1}</i>${esc(l)}</li>`).join('')}</ol>`;
}
function invStatus(i){
  if(i.status==='paid'||i.rem<=0.0005)return `<span class="pill p-ok">${T('st_paid')}</span>`;
  if(i.overdue)return `<span class="pill p-bad">${T('st_over')}</span>`;
  if(i.paid>0)return `<span class="pill p-warn">${T('st_part')}</span>`;
  return `<span class="pill p-mute">${T('st_unpaid')}</span>`;
}
const qStatus=s=>s==='approved'?`<span class="pill p-ok">${T('q_approved')}</span>`:s==='rejected'?`<span class="pill p-mute">${T('q_rejected')}</span>`:`<span class="pill p-warn">${T('q_sent')}</span>`;
function lines(d){
  return `<details><summary>${T('details')}</summary><ul class="items">${(d.items||[]).map(it=>`<li><span>${esc(it.desc)}${it.qty!==1?` <small>× ${it.qty}</small>`:''}${it.disc>0?` <small>(−${f3(it.disc)})</small>`:''}</span><b>${f3(it.qty*it.unit-it.disc)}</b></li>`).join('')}</ul></details>`;
}
function totals(d,showPaid){
  let h='<div class="rows">';
  if(d.disc>0||d.vat>0)h+=`<div class="row"><span>${T('subtotal')}</span><b>${money(d.subtotal)}</b></div>`;
  if(d.disc>0)h+=`<div class="row"><span>${T('disc')}</span><b>− ${money(d.disc)}</b></div>`;
  if(d.vat>0)h+=`<div class="row"><span>${T('vat')} ${d.vatRate}%</span><b>${money(d.vat)}</b></div>`;
  h+=`<div class="row big"><span>${T('total')}</span><b>${money(d.grand)}</b></div>`;
  if(showPaid&&d.paid>0&&d.rem>0.0005)h+=`<div class="row"><span>${T('paid')}</span><b>${money(d.paid)}</b></div><div class="row rem"><span>${T('rem')}</span><b>${money(d.rem)}</b></div>`;
  return h+'</div>';
}
function render(){
  const td=todayISO(),S=D.sessions||[],I=D.invoices||[],Q=D.quotes||[],st=D.studio||{};
  const up=S.filter(s=>s.d>=td).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t))[0];
  const due=I.reduce((q,i)=>q+(+i.rem||0),0),gals=S.filter(s=>safeUrl(s.gal)).length;
  const pendQ=Q.filter(q=>q.status==='sent');
  let h=`<section class="hello"><h1>${T('hello')} <span>${esc(D.first||'')}</span> 👋</h1><p>${T('sub')}</p></section>`;
  if(up){const n=daysTo(up.d);h+=`<div class="rule"></div><div class="card gold next"><div class="datebox"><b>${pd(up.d).getDate()}</b><span>${esc(pd(up.d).toLocaleDateString(loc(),{month:'short'}))}</span></div><div><div class="kicker">${T('next')}</div><h3>${esc(up.n||up.pk||'')}</h3><div class="meta"><span>📅 ${esc(fD(up.d,{weekday:'long',day:'numeric',month:'long'}))}</span>${up.t?`<span>🕒 ${esc(up.t)}${up.te?'–'+esc(up.te):''}</span>`:''}${up.loc?`<span>📍 ${esc(up.loc)}</span>`:''}</div><span class="count">${n===0?T('today'):n===1?T('tomorrow'):T('inDays').replace('{n}',n)}</span></div></div>`}
  else h+='<div class="rule"></div>';
  h+=`<div class="sum"><div class="chip"><span>${T('due')}</span><b class="${due>0.0005?'due':'ok'}">${due>0.0005?f3(due):'✓'}</b>${due>0.0005?` <small class="muted">${T('cur')}</small>`:`<small class="muted" style="display:block">${T('allPaid')}</small>`}</div><div class="chip"><span>${T('projects')}</span><b>${S.length}</b></div><div class="chip"><span>${T('galleries')}</span><b>${gals}</b></div></div>`;
  if(pendQ.length)h+=`<div class="alert"><span>📄 ${T('pendingQ')}</span><button class="btn btn-gold" style="padding:8px 14px;font-size:14px" data-go="sec-q">${T('view')}</button></div>`;

  // projects
  h+=`<div class="sec"><h2>${T('projects')}</h2><small>${S.length||''}</small></div>`;
  h+=S.length?S.slice().sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t)).map(s=>{const g=safeUrl(s.gal);return `<article class="card"><div class="ph"><div><h3>${esc(s.n||s.pk||'—')}</h3><div class="meta">${esc(fD(s.d))}${s.t?' · '+esc(s.t):''}${s.loc?' · 📍 '+esc(s.loc):''}</div></div>${s.pk&&s.pk!==s.n?`<span class="pill p-mute">${esc(s.pk)}</span>`:''}</div>${stepper(s.stage)}
    <div class="dline">${s.due&&s.stage!=='delivered'?`<span class="muted">⏳ ${T('delivery')}: <b style="color:var(--text)">${esc(fD(s.due))}</b></span>`:'<span></span>'}${g?`<a class="btn btn-gold" href="${esc(g)}" target="_blank" rel="noopener noreferrer">🖼 ${T('gallery')}</a>`:(s.stage!=='booked'?`<span class="gal-wait">${T('galleryWait')}</span>`:'')}</div></article>`}).join(''):`<div class="card empty">${T('noProjects')}</div>`;

  // quotations
  if(Q.length){
    h+=`<div class="sec" id="sec-q"><h2>${T('quotes')}</h2><small>${Q.length}</small></div>`;
    h+=Q.map(q=>`<article class="card${q.status==='sent'?' gold':''}"><div class="ph"><div><h3>${esc(q.number)}</h3><div class="meta">${esc(fD(q.date))}${q.valid?' · '+T('validUntil')+' '+esc(fD(q.valid)):''}</div></div>${qStatus(q.status)}</div>${lines(q)}${totals(q,false)}${q.notes?`<div class="note">${esc(q.notes)}</div>`:''}
      <div class="acts">${q.status==='sent'?`<button class="btn btn-gold" data-ok="${esc(q.id)}">✓ ${T('approve')}</button><button class="btn btn-line" data-no="${esc(q.id)}">${T('reject')}</button>`:''}<button class="btn btn-line" data-pq="${esc(q.id)}">🖨 ${T('print')}</button></div></article>`).join('');
  }

  // invoices
  h+=`<div class="sec"><h2>${T('invoices')}</h2><small>${I.length||''}</small></div>`;
  h+=I.length?I.map(i=>`<article class="card"><div class="ph"><div><h3>${esc(i.number)}</h3><div class="meta">${T('issued')} ${esc(fD(i.date))}${i.rem>0.0005&&i.due?' · '+T('dueDate')+' '+esc(fD(i.due)):''}</div></div>${invStatus(i)}</div>${lines(i)}${totals(i,true)}<div class="acts"><button class="btn btn-line" data-pi="${esc(i.id)}">🖨 ${T('print')}</button></div></article>`).join(''):`<div class="card empty">${T('noInv')}</div>`;

  // footer
  const wa=String(st.wa||'').replace(/\D/g,''),ig=String(st.insta||'').replace(/^@/,'').replace(/[^\w.]/g,'');
  h+=`<footer class="foot"><div class="kicker">${T('contact')}</div><div class="links">${wa?`<a class="btn btn-line" href="https://wa.me/${wa}?text=${encodeURIComponent(T('waHi').replace('{n}',D.name||''))}" target="_blank" rel="noopener">💬 ${T('whatsapp')}</a>`:''}${ig?`<a class="btn btn-line" href="https://instagram.com/${ig}" target="_blank" rel="noopener">📷 ${T('insta')}</a>`:''}</div>${st.addr?`<div>${esc(st.addr)}</div>`:''}${D.updated?`<div style="margin-top:6px;font-size:12px">${T('updated')}: ${esc(new Date(D.updated).toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'}))}</div>`:''}</footer>`;
  if(wa)h+=`<a class="fab" href="https://wa.me/${wa}?text=${encodeURIComponent(T('waHi').replace('{n}',D.name||''))}" target="_blank" rel="noopener" aria-label="${T('whatsapp')}">💬 ${T('whatsapp')}</a>`;
  $('app').innerHTML=h;
}

// ── actions ──
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!D)return;
  if(b.dataset.go){const el=$(b.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(b.dataset.pi){printDoc(D.invoices.find(x=>String(x.id)===b.dataset.pi),'inv');return}
  if(b.dataset.pq){printDoc(D.quotes.find(x=>x.id===b.dataset.pq),'q');return}
  const ok=b.dataset.ok,no=b.dataset.no;if(!ok&&!no)return;
  let note=null;
  if(ok&&!confirm(T('confirmApprove')))return;
  if(no){note=prompt(T('rejectAsk'),'');if(note===null)return}
  b.disabled=true;
  try{
    const r=await rpc('portal_act',{t:tok,p:PIN||null,k:ok?'approve_quote':'reject_quote',r:ok||no,n:note||null});
    if(r&&r.ok){const q=D.quotes.find(x=>x.id===(ok||no));if(q)q.status=ok?'approved':'rejected';render();toast(ok?T('approvedMsg'):T('rejectedMsg'))}
    else{toast(r&&r.error==='state'?T('stateErr'):T('net'));load(PIN)}
  }catch(err){b.disabled=false;toast(T('net'))}
});
function printDoc(d,kind){
  if(!d)return;const st=D.studio||{},q=kind==='q';
  const title=q?T('quotation'):(d.vat>0&&st.vatNo?T('taxInv'):T('invoice'));
  const co=[st.cr?'CR '+st.cr:'',st.vatNo?'VAT '+st.vatNo:'',st.addr,st.phone,st.email].filter(Boolean).map(esc).join(' · ');
  const tr=(l,v)=>`<tr><td colspan="3" class="n">${l}</td><td class="n">${f3(v)}</td></tr>`;
  $('print').innerHTML=`<div class="pdoc" dir="${lang==='ar'?'rtl':'ltr'}"><div class="ph1"><div><div class="brand">${esc($('logo').textContent)}</div><div class="co">${co}</div></div><div><h2>${title}</h2><div class="co" style="text-align:end">${esc(d.number)} · ${esc(fD(d.date))}${q&&d.valid?'<br>'+T('validUntil')+' '+esc(fD(d.valid)):''}${!q&&d.due?'<br>'+T('dueDate')+' '+esc(fD(d.due)):''}</div></div></div>
  <p style="margin:16px 0 0"><b>${T('billTo')}:</b> ${esc(D.name||'')}</p>
  <table><thead><tr><th>${T('desc')}</th><th class="n">${T('qty')}</th><th class="n">${T('price')}</th><th class="n">${T('line')}</th></tr></thead><tbody>${(d.items||[]).map(it=>`<tr><td>${esc(it.desc)}</td><td class="n">${it.qty}</td><td class="n">${f3(it.unit)}</td><td class="n">${f3(it.qty*it.unit-it.disc)}</td></tr>`).join('')}</tbody>
  <tfoot>${d.disc>0||d.vat>0?tr(T('subtotal'),d.subtotal):''}${d.disc>0?tr(T('disc'),-d.disc):''}${d.vat>0?tr(T('vat')+' '+d.vatRate+'%',d.vat):''}${tr(T('total')+' ('+T('cur')+')',d.grand)}${!q&&d.paid>0&&d.rem>0.0005?tr(T('paid'),d.paid)+tr(T('rem'),d.rem):''}</tfoot></table>
  ${d.notes?`<p style="font-size:12px;color:#555;white-space:pre-line;margin-top:16px">${esc(d.notes)}</p>`:''}</div>`;
  setTimeout(()=>window.print(),50);
}

let saved='';try{saved=sessionStorage.getItem(PK)||''}catch(e){}
load(saved);
})();
</script>
