<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#efebe6">
<title>صفحتي | شعيب استوديو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="supabase-config.js"></script>
<style>
/* ===== Neo-Tactile Soft UI — نفس ثيم صفحة الحجز (فاتح + داكن) ===== */
body.light-mode{
  --bg:#efebe6;--bg-soft:#ece7e0;--card:#ebe6df;
  --gold:#8fa994;--gold-light:#8a5f56;--gold-dim:#d3c9bd;
  --text:#5a524b;--text-dim:#8a8178;--line:#ddd5cb;--green:#5f8a6c;--red:#b86a63;
  --sh-d:#d3cbc1;--sh-l:#ffffff;--rim:rgba(255,255,255,.85);
  --card-g:linear-gradient(145deg,#f4f0eb,#e7e1d9);
  --sunk:inset 3px 3px 7px #d6cec4,inset -3px -3px 7px #fbf9f6;
  --bar:rgba(240,236,231,.92);--float:10px 12px 24px #cfc6bb,-8px -8px 18px #fff;--pressed:#e4ded6;
}
body:not(.light-mode){
  --bg:#2a2622;--bg-soft:#312c27;--card:#38322d;
  --gold:#9fb8a4;--gold-light:#e6bfb3;--gold-dim:#5a5149;
  --text:#efe7de;--text-dim:#b0a69b;--line:#4a4239;--green:#9cc8a8;--red:#e39a90;
  --sh-d:#1f1c19;--sh-l:#3d3731;--rim:rgba(255,255,255,.07);
  --card-g:linear-gradient(145deg,#3d3732,#322d28);
  --sunk:inset 3px 3px 7px #211e1b,inset -3px -3px 7px #3d3731;
  --bar:rgba(46,41,37,.94);--float:10px 12px 24px #1d1a17,-8px -8px 18px #3f3933;--pressed:#2f2a26;
}
body{
  --lift:6px 6px 14px var(--sh-d),-6px -6px 14px var(--sh-l);
  --lift-sm:3px 3px 8px var(--sh-d),-3px -3px 8px var(--sh-l);
  --focus:#5aa7e8;--focus-ring:0 0 0 2px rgba(90,167,232,.55),0 0 14px rgba(90,167,232,.4);
  --btn-sage:linear-gradient(145deg,#9fb8a4,#86a08b);--rose-g:linear-gradient(145deg,#cba397,#b58479);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{position:relative;color:var(--text);font-family:'Tajawal',sans-serif;line-height:1.65;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body.light-mode{background:radial-gradient(ellipse at 50% 0%,#f6f3ef 0%,#efebe6 55%,#e8e2db 100%) fixed}
body:not(.light-mode){background:radial-gradient(ellipse at 50% 0%,#3a342f 0%,#2a2622 65%) fixed}
::selection{background:#d9c7bf;color:#4a423b}
button,input{font:inherit;color:inherit}
.wrap{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 18px 110px}

/* top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.studio-logo{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:26px;color:var(--text);letter-spacing:1px}
html[lang="en"] .studio-logo{font-size:22px}
.top-actions{display:flex;align-items:center;gap:10px}
.pill-btn{border:1px solid var(--rim);background:var(--card-g);color:var(--text-dim);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--lift-sm);transition:box-shadow .2s,color .2s}
.pill-btn:hover{color:var(--text)}
.pill-btn:active{box-shadow:var(--sunk)}

/* moon toggle (من صفحة الحجز) */
.theme-toggle{position:relative;width:76px;height:40px;flex-shrink:0;padding:0;direction:ltr;border-radius:24px;border:1px solid var(--rim);background:var(--card-g);box-shadow:var(--lift-sm);cursor:pointer;outline:none;transition:background .6s,box-shadow .6s}
body:not(.light-mode) .theme-toggle{background:var(--bg-soft);box-shadow:var(--sunk)}
.theme-toggle:focus-visible{box-shadow:var(--focus-ring)}
.theme-toggle .knob{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;transform:translateX(36px);transition:transform .7s cubic-bezier(.65,-0.2,.25,1.25)}
body.light-mode .theme-toggle .knob{transform:translateX(0)}
.theme-toggle .knob::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:radial-gradient(circle,rgba(190,205,255,.75),transparent 68%);filter:blur(4px);transition:background .6s}
body.light-mode .theme-toggle .knob::before{background:radial-gradient(circle,rgba(255,190,60,.55),transparent 68%)}
.theme-toggle .knob svg{position:absolute;width:30px;height:30px;overflow:visible;transition:opacity .5s,transform .8s cubic-bezier(.3,1.3,.5,1)}
.theme-toggle .moon{opacity:1;transform:none;filter:drop-shadow(0 0 5px rgba(200,215,255,.9))}
.theme-toggle .sun{opacity:0;transform:rotate(-90deg) scale(.4);filter:drop-shadow(0 0 5px rgba(255,190,60,.9))}
body.light-mode .theme-toggle .sun{opacity:1;transform:none}
body.light-mode .theme-toggle .moon{opacity:0;transform:rotate(90deg) scale(.4)}
.theme-toggle .spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#cfd9ff;box-shadow:0 0 5px #cfd9ff;opacity:0;transition:opacity .6s;animation:tgTwinkle 2.6s ease-in-out infinite}
body:not(.light-mode) .theme-toggle .spark{opacity:.9}
.theme-toggle .spark:nth-child(1){top:5px;left:14px;animation-delay:.1s}
.theme-toggle .spark:nth-child(2){top:30px;left:22px;animation-delay:.9s;width:2px;height:2px}
.theme-toggle .spark:nth-child(3){top:12px;left:30px;animation-delay:1.6s;width:2px;height:2px}
@keyframes tgTwinkle{0%,100%{transform:scale(.6);opacity:.3}50%{transform:scale(1.3);opacity:1}}
.moon-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;opacity:0;transition:opacity 1s ease}
body:not(.light-mode) .moon-fx{opacity:1}
.moon-fx .beam{position:absolute;left:0;top:0;width:1px;height:1px}
.moon-fx .beam i{position:absolute;top:0;left:0;display:block}
.moon-fx .cone{width:560px;height:820px;margin-left:-280px;margin-top:-20px;transform-origin:50% 0;background:radial-gradient(ellipse 48% 100% at 50% 0%,rgba(165,185,255,.42) 0%,rgba(130,150,240,.2) 38%,rgba(110,130,225,.07) 62%,transparent 82%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.65) 40%,transparent 96%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.65) 40%,transparent 96%);transform:rotate(14deg);animation:tgBreathe 7s ease-in-out infinite}
.moon-fx .core{width:260px;height:560px;margin-left:-130px;margin-top:-10px;transform-origin:50% 0;background:radial-gradient(ellipse 50% 100% at 50% 0%,rgba(240,245,255,.5) 0%,rgba(185,200,255,.18) 40%,transparent 78%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.5) 45%,transparent 95%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.5) 45%,transparent 95%);transform:rotate(14deg);animation:tgBreathe 5.5s ease-in-out infinite reverse}
.moon-fx .halo{width:300px;height:300px;margin-left:-150px;margin-top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(170,190,255,.4),transparent 65%)}
.moon-fx .cone,.moon-fx .core,.moon-fx .halo{filter:sepia(.6) saturate(.5) hue-rotate(-20deg) blur(18px);opacity:.7}
@keyframes tgBreathe{0%,100%{opacity:.5}50%{opacity:.75}}
.moon-fx .dust b{position:absolute;border-radius:50%;background:rgba(220,230,255,.8);box-shadow:0 0 6px rgba(200,215,255,.9);animation:tgFloat 7s ease-in-out infinite}
@keyframes tgFloat{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(10px,-22px);opacity:.9}}

/* header / hero */
header{text-align:center;margin:6px 0 26px}
.brand-logo{display:block;width:110px;height:auto;margin:0 auto 10px}
h1{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:clamp(28px,7vw,38px);margin:0 0 6px;color:var(--text)}
h1 span{color:var(--gold-light)}
header p.sub{color:var(--text-dim);font-size:15px;margin:0}
.hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--rim);box-shadow:var(--float);margin:0 0 26px;aspect-ratio:4/3;max-height:460px;width:100%;background:var(--bg-soft)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;inset-inline:0;bottom:0;padding:60px 22px 20px;background:linear-gradient(transparent,rgba(30,24,20,.78));color:#fff}
.hero .cap small{display:block;font-size:13px;opacity:.85;font-weight:700;letter-spacing:.02em}
.hero .cap h1{color:#fff;margin:2px 0 0;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hero .cap h1 span{color:#f3d6cc}
@media(min-width:620px){.hero{aspect-ratio:16/10}}

/* section titles (مثل صفحة الحجز) */
.section-title{display:flex;align-items:center;gap:12px;margin:36px 0 16px}
.section-title .num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font:700 15px 'Tajawal',sans-serif;background:var(--card-g);color:var(--gold-light);border:1px solid var(--rim);box-shadow:var(--lift-sm)}
.section-title h2{font-size:19px;margin:0;color:var(--text);font-weight:800}
.section-title .line{flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
html[dir="ltr"] .section-title .line{background:linear-gradient(to right,var(--line),transparent)}
.section-title small{color:var(--text-dim);font-size:13px}

/* cards */
.card{background:var(--card-g);border:1px solid var(--rim);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--lift)}
.card.focus{border:1.5px solid var(--focus);box-shadow:var(--lift),var(--focus-ring)}
.muted{color:var(--text-dim)}
.kicker{font-size:12.5px;font-weight:800;color:var(--gold-light)}

/* next session = rose card */
.next{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--rose-g);border:1px solid rgba(255,255,255,.4);box-shadow:var(--float);color:#fff}
.next .kicker{color:rgba(255,255,255,.9)}
.datebox{width:84px;height:92px;border-radius:18px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center}
.datebox b{font-size:36px;line-height:1;font-weight:800}
.datebox span{font-size:12px;opacity:.9;margin-top:4px}
.next h3{margin:2px 0 4px;font-size:19px}
.next .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;opacity:.92}
.count{display:inline-block;margin-top:9px;padding:4px 13px;border-radius:999px;background:#fff;color:#a67669;font-weight:800;font-size:13px}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chip{background:var(--card-g);border:1px solid var(--rim);border-radius:16px;padding:12px 14px;box-shadow:var(--lift-sm);min-width:0}
.chip span{display:block;font-size:12px;color:var(--text-dim);font-weight:700}
.chip b{font-size:20px;font-weight:800;direction:ltr;display:inline-block;color:var(--text)}
.chip b.due{color:var(--red)}.chip b.ok{color:var(--green)}
button.chip{font:inherit;text-align:start;cursor:pointer;color:inherit}
button.chip:active{box-shadow:var(--sunk)}
.alert{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:16px;padding:12px 16px;border-radius:16px;font-weight:700;font-size:14px;background:var(--card-g);border:1.5px solid var(--focus);box-shadow:var(--lift-sm),var(--focus-ring)}

/* project + stepper */
.ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph h3{margin:0;font-size:17px;color:var(--text)}
.ph .meta{font-size:13px;color:var(--text-dim);margin-top:2px}
.steps{list-style:none;padding:0;margin:20px 0 8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.steps:before{content:"";position:absolute;top:13px;inset-inline:10%;height:3px;border-radius:3px;background:var(--bg-soft);box-shadow:var(--sunk)}
.steps .bar{position:absolute;top:13px;inset-inline-start:10%;height:3px;border-radius:3px;background:var(--btn-sage);transition:width .7s}
.steps li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;font-size:11.5px;color:var(--text-dim);line-height:1.3;padding:0 2px;font-weight:600}
.steps i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;z-index:1;background:var(--card-g);border:1px solid var(--rim);box-shadow:var(--lift-sm);color:var(--text-dim)}
.steps li.done i{background:var(--btn-sage);color:#fff;border-color:rgba(255,255,255,.4)}
.steps li.done{color:var(--text)}
.steps li.cur i{background:var(--rose-g);color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 0 0 5px rgba(185,139,128,.22);animation:pulse 2s infinite}
.steps li.cur{color:var(--gold-light);font-weight:800}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(185,139,128,.08)}}
.dline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn-sage{background:var(--btn-sage);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:var(--lift-sm);text-shadow:0 1px 1px rgba(60,80,65,.25)}
.btn-sage:hover{transform:translateY(-1px);box-shadow:var(--lift-sm),0 0 0 2px rgba(147,173,152,.45),0 0 16px rgba(147,173,152,.55)}
.btn-sage:active{transform:none;background:linear-gradient(145deg,#7d9885,#8fa995);box-shadow:inset 3px 3px 7px #627a69,inset -3px -3px 7px #a4bca9}
.btn-soft{background:var(--card-g);color:var(--text);border:1px solid var(--rim);box-shadow:var(--lift-sm)}
.btn-soft:hover{transform:translateY(-1px)}
.btn-soft:active{box-shadow:var(--sunk);transform:none}
.btn[disabled]{background:var(--pressed);color:var(--text-dim);box-shadow:none;cursor:default;text-shadow:none}
.btn.full{width:100%}
.gal-wait{font-size:13px;color:var(--text-dim);border-radius:12px;padding:8px 12px;background:var(--bg-soft);box-shadow:var(--sunk)}

/* pills */
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-ok{background:rgba(95,138,108,.14);color:var(--green);border:1px solid rgba(95,138,108,.3)}
.p-warn{background:rgba(201,150,60,.14);color:#a5732a;border:1px solid rgba(201,150,60,.32)}
body:not(.light-mode) .p-warn{color:#e3b867}
.p-bad{background:rgba(184,106,99,.13);color:var(--red);border:1px solid rgba(184,106,99,.3)}
.p-mute{background:var(--bg-soft);color:var(--text-dim);box-shadow:var(--sunk)}

/* money */
.rows{margin-top:12px;padding:6px 14px;border-radius:14px;background:var(--bg-soft);box-shadow:var(--sunk)}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{direction:ltr}
.row.big{font-size:17px;font-weight:800}
.row.big b{color:var(--gold-light)}
.row.rem b{color:var(--red)}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details.lines{margin-top:10px}
.lsum{color:var(--gold-light);font-size:14px;font-weight:800}
.lsum:after{content:" ▾"}
details[open]>.lsum:after{content:" ▴"}
/* التفاصيل (الفواتير) — مطوية */
details.fold>summary.section-title{margin:36px 0 16px;-webkit-tap-highlight-color:transparent}
.chev{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card-g);border:1px solid var(--rim);box-shadow:var(--lift-sm);color:var(--text-dim);font-size:12px;transition:transform .3s;flex-shrink:0}
details[open]>summary .chev{transform:rotate(180deg)}
details.inv{padding:0}
.isum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px}
.isum h3{margin:0;font-size:16px;color:var(--text)}
.isum .meta{font-size:12.5px;color:var(--text-dim)}
.isum .amt{direction:ltr;font-weight:800;color:var(--text);white-space:nowrap}
.ibody{padding:0 18px 18px}
/* ⚡ المعاينة */
.pv .kicker{font-size:13.5px}
.pv h3{margin:2px 0 2px;font-size:20px;color:var(--text)}
.cf{position:relative;overflow:hidden;margin:16px 0 8px;aspect-ratio:16/10;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cf-c{position:absolute;left:50%;top:50%;width:58%;height:80%;background:#fff;border:6px solid #fff;border-radius:3px;box-shadow:0 10px 24px rgba(60,45,35,.28);cursor:pointer;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s;overflow:hidden}
.cf-c img{position:absolute;inset:0 0 26px 0;width:100%;height:calc(100% - 26px);object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.cf-c i{position:absolute;left:0;right:0;bottom:0;height:26px;display:grid;place-items:center;font:600 13px 'Aref Ruqaa','Tajawal',serif;font-style:normal;color:#8a7a63;opacity:0;transition:opacity .4s}
.cf-c.cur i{opacity:1}
.cf-c.cur{cursor:zoom-in}
.cf-n{position:absolute;top:50%;transform:translateY(-50%);z-index:200;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.85);color:#6b5f55;font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:var(--lift-sm)}
.cf-n.p{left:0}.cf-n.x{right:0}
.pvg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.pvg button{all:unset;cursor:zoom-in;position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg-soft);box-shadow:var(--lift-sm)}
.pvg button:first-child{grid-column:span 2;grid-row:span 2}
.pvg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.pvg button:hover img{transform:scale(1.04)}
.pvg button:focus-visible{outline:3px solid var(--focus)}
.wait{display:flex;gap:14px;align-items:center}
.wait .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--btn-sage);box-shadow:var(--lift-sm);flex-shrink:0}
.wait b{display:block;font-size:16px;color:var(--text)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(14,11,9,.94);display:flex;flex-direction:column;touch-action:pan-y}
.lb[hidden]{display:none}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 8px;color:#fff;font-weight:700}
.lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px;position:relative}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;user-select:none;-webkit-user-drag:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
.lb-prev{inset-inline-start:10px}.lb-next{inset-inline-end:10px}
.lb-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 14px max(16px,env(safe-area-inset-bottom))}
.lb-x{border:0;background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.items{margin:8px 0 0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.items li b{direction:ltr;white-space:nowrap}
.items small{color:var(--text-dim)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts .btn{flex:1 1 140px}
.note{margin-top:10px;font-size:13px;color:var(--text-dim);white-space:pre-line}

/* retention notice */
.keep{display:flex;gap:14px;align-items:center;margin-top:34px;padding:16px 18px;border-radius:18px;background:var(--bg-soft);box-shadow:var(--sunk);border:1px solid var(--line)}
.keep .ic{width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--rose-g);box-shadow:var(--lift-sm)}
.keep p{margin:0;font-weight:800;font-size:15px;line-height:1.7;color:var(--text)}

/* pin */
.center{min-height:66vh;display:flex;align-items:center;justify-content:center}
.pinbox{width:min(390px,100%);text-align:center;padding:26px 22px}
.pins{display:flex;gap:12px;justify-content:center;direction:ltr;margin:20px 0 6px}
.pins input{width:56px;height:62px;border-radius:16px;border:1px solid var(--line);background:var(--bg-soft);box-shadow:var(--sunk);text-align:center;font-size:26px;font-weight:800;outline:none;color:var(--text);caret-color:var(--gold-light)}
.pins input:focus{border-color:var(--focus);box-shadow:var(--sunk),var(--focus-ring)}
.err{color:var(--red);min-height:24px;font-size:14px;font-weight:700}

/* skeleton */
.sk{border-radius:18px;background:var(--bg-soft);box-shadow:var(--sunk);margin-bottom:16px;animation:skp 1.4s ease-in-out infinite}
@keyframes skp{50%{opacity:.55}}

/* footer (مثل صفحة الحجز) */
.site-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:26px 0 6px}
.ig-link{display:inline-flex;align-items:center;gap:10px;padding:.75rem 1.3rem;border-radius:14px;border:1px solid var(--rim);background:var(--card-g);color:var(--text);text-decoration:none;font:600 14.5px 'Tajawal',sans-serif;box-shadow:var(--lift-sm);transition:transform .15s,box-shadow .2s}
.ig-link svg{color:#b5557a}
.wa-link svg{color:#3f8f5f}
.ig-link b{color:var(--gold-light)}
.ig-link:hover{transform:translateY(-1px);box-shadow:var(--lift-sm),0 0 0 2px rgba(181,85,122,.35)}
.wa-link:hover{box-shadow:var(--lift-sm),0 0 0 2px rgba(63,143,95,.35)}
.upd{text-align:center;font-size:12px;color:var(--text-dim);margin-top:10px}
.fab{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));inset-inline-end:16px;z-index:20;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--btn-sage);color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:var(--float)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:30;background:var(--card-g);border:1px solid var(--rim);color:var(--text);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:90vw;text-align:center;box-shadow:var(--float)}
.toast[hidden]{display:none}
.empty{text-align:center;color:var(--text-dim);padding:18px;font-size:14px}

/* printable invoice / quotation */
#print{display:none}
@media print{body{background:#fff!important}body>*:not(#print){display:none!important}#print{display:block;color:#111;font-family:'Tajawal',sans-serif}}
.pdoc{max-width:760px;margin:0 auto;padding:28px}
.pdoc .ph1{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b98b80;padding-bottom:14px}
.pdoc .brand{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:26px;color:#5a524b}
.pdoc .co{font-size:12px;color:#555;margin-top:4px}
.pdoc h2{margin:0;font-size:20px;color:#8a5f56;text-align:end}
.pdoc table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}
.pdoc th{background:#efe8e1;color:#5a524b;text-align:start;padding:8px}
.pdoc td{padding:8px;border-bottom:1px solid #eee}
.pdoc .n{text-align:end;direction:ltr;white-space:nowrap}
.pdoc tfoot td{font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:440px){.steps li{font-size:10.5px}.next{grid-template-columns:1fr}.datebox{width:100%;height:auto;flex-direction:row;gap:10px;padding:10px}.studio-logo{font-size:21px}}

const daysTo=d=>Math.round((pd(d)-pd(todayISO()))/864e5);

function placeBeam(){const r=tgl.getBoundingClientRect();beam.style.left=(r.left+window.scrollX+r.width*.68)+'px';beam.style.top=(r.top+window.scrollY+r.height*.5)+'px'}
function applyTheme(dark){document.body.classList.toggle('light-mode',!dark);tgl.setAttribute('aria-checked',String(dark));document.querySelector('meta[name="theme-color"]').content=dark?'#2a2622':'#efebe6';placeBeam()}

async function rpc(fn,body){
  const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent=T('other');tgl.setAttribute('aria-label',T('dark'));
  const nm=D&&D.studio&&D.studio.name||'';
  $('logo').textContent=lang==='ar'&&(!nm||/shuaib/i.test(nm))?'شعيب استوديو':(nm||'Shuaib Studio');
  document.title=(lang==='ar'?'صفحتي':'My page')+' | '+$('logo').textContent;
  placeBeam();
}
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('pt_lang',lang)}catch(e){}applyLang();if(D)render();else if($('pinForm'))pinScreen(PNM,PER)};

function msgScreen(text,retry){
  $('app').innerHTML=`<div class="center"><div class="card" style="text-align:center;max-width:420px;padding:26px"><div style="font-size:40px;margin-bottom:6px">${retry?'📶':'🔒'}</div><p style="margin:0 0 16px;font-weight:700">${esc(text)}</p>${retry?`<button class="btn btn-sage" id="retry">${T('retry')}</button>`:''}</div></div>`;
  if(retry)$('retry').onclick=()=>load(PIN);
}
function pinScreen(name,err){
  PNM=name;PER=err;
  $('app').innerHTML=`<div class="center"><form class="card pinbox" id="pinForm" autocomplete="off">
    <img class="brand-logo" src="logo.png" alt="" width="90" onerror="this.remove()" style="width:90px">
    <div class="kicker">${T('pinTitle')}</div><h1 style="font-size:26px;margin:6px 0 2px">${T('hello')}${name?' <span>'+esc(name)+'</span>':''} 👋</h1>
    <p class="muted" style="margin:0">${T('pinSub')}</p>
    <div class="pins">${[0,1,2,3].map(i=>`<input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${i+1}" data-p="${i}">`).join('')}</div>
    <div class="err" role="alert">${err==='locked'?T('locked'):err?T('pinBad'):''}</div>
    <button class="btn btn-sage full" type="submit">${T('enter')}</button></form></div>`;
  const ins=[...document.querySelectorAll('[data-p]')];ins[0].focus();
  ins.forEach((el,i)=>{
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value))$('pinForm').requestSubmit()});
    el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus()});
    el.addEventListener('paste',e=>{const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(v.length===4){e.preventDefault();ins.forEach((x,j)=>x.value=v[j]);$('pinForm').requestSubmit()}});
  });
  $('pinForm').onsubmit=e=>{e.preventDefault();const v=ins.map(x=>x.value).join('');if(v.length===4)load(v)};
}
async function load(pin){
  applyLang();
  if(!tok)return msgScreen(T('invalid'));
  if(!SB.url||!SB.key)return msgScreen(T('config'));
  let r;
  try{r=await rpc('portal_get',{t:tok,p:pin||null})}catch(e){return msgScreen(T('net'),true)}
  if(r&&r.error){
    try{sessionStorage.removeItem(PK)}catch(e){}
    if(r.error==='pin')return pinScreen(r.name,pin?'bad':'');
    if(r.error==='locked')return pinScreen(r.name,'locked');
    return msgScreen(T('invalid'));
  }
  D=r;PIN=pin||'';try{if(PIN)sessionStorage.setItem(PK,PIN)}catch(e){}
  applyLang();render();
}

// ── render ──
let secN=0;
const secTitle=(t,count,id)=>`<div class="section-title"${id?` id="${id}"`:''}><span class="num">${T('nums')[secN++]||secN}</span><h2>${t}</h2><span class="line"></span>${count?`<small>${count}</small>`:''}</div>`;
function stepper(stage){
  const k=Math.max(0,STG.indexOf(stage)),all=stage==='delivered',w=k/(STG.length-1)*80;
  return `<ol class="steps" aria-label="progress"><span class="bar" style="width:${w}%"></span>${T('stages').map((l,i)=>{const done=i<k||all;return `<li class="${done?'done':i===k?'cur':''}"><i>${done?'✓':i+1}</i>${esc(l)}</li>`}).join('')}</ol>`;
}
function invStatus(i){
  if(i.status==='paid'||i.rem<=0.0005)return `<span class="pill p-ok">${T('st_paid')}</span>`;
  if(i.overdue)return `<span class="pill p-bad">${T('st_over')}</span>`;
  if(i.paid>0)return `<span class="pill p-warn">${T('st_part')}</span>`;
  return `<span class="pill p-mute">${T('st_unpaid')}</span>`;
}
const qStatus=s=>s==='approved'?`<span class="pill p-ok">${T('q_approved')}</span>`:s==='rejected'?`<span class="pill p-mute">${T('q_rejected')}</span>`:`<span class="pill p-warn">${T('q_sent')}</span>`;
function lines(d){
  return `<details class="lines"><summary class="lsum">${T('details')}</summary><ul class="items">${(d.items||[]).map(it=>`<li><span>${esc(it.desc)}${it.qty!==1?` <small>× ${it.qty}</small>`:''}${it.disc>0?` <small>(−${f3(it.disc)})</small>`:''}</span><b>${f3(it.qty*it.unit-it.disc)}</b></li>`).join('')}</ul></details>`;
}
function totals(d,showPaid){
  let h='<div class="rows">';
  if(d.disc>0||d.vat>0)h+=`<div class="row"><span>${T('subtotal')}</span><b>${money(d.subtotal)}</b></div>`;
  if(d.disc>0)h+=`<div class="row"><span>${T('disc')}</span><b>− ${money(d.disc)}</b></div>`;
  if(d.vat>0)h+=`<div class="row"><span>${T('vat')} ${d.vatRate}%</span><b>${money(d.vat)}</b></div>`;
  h+=`<div class="row big"><span>${T('total')}</span><b>${money(d.grand)}</b></div>`;
  if(showPaid&&d.paid>0&&d.rem>0.0005)h+=`<div class="row"><span>${T('paid')}</span><b>${money(d.paid)}</b></div><div class="row rem"><span>${T('rem')}</span><b>${money(d.rem)}</b></div>`;
  return h+'</div>';

function cfStyle(i,cur,N){
  let d=i-cur;d=((d+N/2)%N+N)%N-N/2;const ad=Math.abs(d),sg=d<0?-1:1;
  const x=sg*(ad<1?ad*60:60+(ad-1)*20),sc=1-0.13*Math.min(ad,3),op=Math.max(0,Math.min(1,3.4-ad));
  return `transform:translate(calc(-50% + ${x}%),-50%) scale(${sc.toFixed(3)});opacity:${op.toFixed(2)};z-index:${Math.round(100-ad*10)}`;
}
function cfSet(root,cur){
  const cs=[...root.querySelectorAll('.cf-c')],N=cs.length;cur=((cur%N)+N)%N;root.dataset.cur=cur;
  cs.forEach((c,i)=>{c.style.cssText=cfStyle(i,cur,N);c.classList.toggle('cur',i===cur)});
}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-cfn]');
  if(n){const r=n.closest('.cf');cfSet(r,+r.dataset.cur+ +n.dataset.cfn);e.stopPropagation();return}
  const c=e.target.closest('.cf-c');if(!c)return;
  const r=c.closest('.cf'),i=+c.dataset.ci;
  if(r._moved){r._moved=0;return}
  if(i===+r.dataset.cur)lbOpen(r.dataset.cf,i);else cfSet(r,i);
},true);
(()=>{let x0=null,r0=null;
  document.addEventListener('pointerdown',e=>{const r=e.target.closest('.cf');if(r){x0=e.clientX;r0=r;r._moved=0}});
  document.addEventListener('pointerup',e=>{if(!r0)return;const dx=e.clientX-x0,r=r0;r0=null;

// صانع الستوري (1080×1920)
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src});
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
async function makeStory(s,i){
  // ستوري بتصميم راقٍ: 3 صور متتالية (تبدأ من الصورة i) في إطارات متراصّة على خلفية فاتحة، وعبارة الحمد على الصورة الوسطى
  const n=s.pv.n.filter(okId),imgs=await Promise.all([0,1,2].map(k=>loadImg(pvSrc(s.pv,n[(i+k)%n.length]))));
  try{await document.fonts.ready}catch(e){}
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#f6f3ee';x.fillRect(0,0,W,H);
  const fw=900,fh=500,gap=14,fx=(W-fw)/2,top=Math.round((H-(3*fh+2*gap))/2)-70,ys=[0,1,2].map(k=>top+k*(fh+gap));
  // كل صورة تُقصّ لتملأ إطارها (cover)
  imgs.forEach((im,k)=>{
    const iw=im.naturalWidth,ih=im.naturalHeight,sc=Math.max(fw/iw,fh/ih),dw=iw*sc,dh=ih*sc;
    x.save();x.beginPath();x.rect(fx,ys[k],fw,fh);x.clip();x.drawImage(im,fx+(fw-dw)/2,ys[k]+(fh-dh)/2,dw,dh);x.restore();
  });
  // تظليل أسفل الصورة الوسطى ليظهر النص
  const g=x.createLinearGradient(0,ys[1]+fh*0.45,0,ys[1]+fh);g.addColorStop(0,'rgba(20,16,13,0)');g.addColorStop(1,'rgba(20,16,13,.68)');
  x.fillStyle=g;x.fillRect(fx,ys[1]+fh*0.45,fw,fh*0.55);
  x.textAlign='center';x.direction='rtl';
  x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=16;x.fillStyle='#fff';
  x.font='600 52px "IBM Plex Sans Arabic", Tajawal, sans-serif';x.fillText('الحمدلله الذي بنعمته تتم الصالحات',W/2,ys[1]+fh-70);x.restore();
  // أسفل التصميم: الاسم والجلسة ثم الحساب بحروف متباعدة
  const by=ys[2]+fh+120;
  x.fillStyle='#5a524b';x.font='700 54px Tajawal, sans-serif';x.fillText(D.first||D.name||'',W/2,by);
  x.fillStyle='#8a8178';x.font='500 34px Tajawal, sans-serif';x.fillText([s.n||s.pk||'',fD(s.d)].filter(Boolean).join(' · '),W/2,by+58);
  x.direction='ltr';x.fillStyle='#9a8f86';x.font='500 30px Tajawal, sans-serif';
  try{x.letterSpacing='10px'}catch(e){}
  x.fillText(handle().toUpperCase(),W/2+5,by+130);
  return new Promise(r=>cv.toBlob(b=>r(b),'image/jpeg',0.92));
}

  $('print').innerHTML=`<div class="pdoc" dir="${lang==='ar'?'rtl':'ltr'}"><div class="ph1"><div><div class="brand">${esc($('logo').textContent)}</div><div class="co">${co}</div></div><div><h2>${title}</h2><div class="co" style="text-align:end">${esc(d.number)} · ${esc(fD(d.date))}${q&&d.valid?'<br>'+T('validUntil')+' '+esc(fD(d.valid)):''}${!q&&d.due?'<br>'+T('dueDate')+' '+esc(fD(d.due)):''}</div></div></div>
  <p style="margin:16px 0 0"><b>${T('billTo')}:</b> ${esc(D.name||'')}</p>
  <table><thead><tr><th>${T('desc')}</th><th class="n">${T('qty')}</th><th class="n">${T('price')}</th><th class="n">${T('line')}</th></tr></thead><tbody>${(d.items||[]).map(it=>`<tr><td>${esc(it.desc)}</td><td class="n">${it.qty}</td><td class="n">${f3(it.unit)}</td><td class="n">${f3(it.qty*it.unit-it.disc)}</td></tr>`).join('')}</tbody>
  <tfoot>${d.disc>0||d.vat>0?tr(T('subtotal'),d.subtotal):''}${d.disc>0?tr(T('disc'),-d.disc):''}${d.vat>0?tr(T('vat')+' '+d.vatRate+'%',d.vat):''}${tr(T('total')+' ('+T('cur')+')',d.grand)}${!q&&d.paid>0&&d.rem>0.0005?tr(T('paid'),d.paid)+tr(T('rem'),d.rem):''}</tfoot></table>
  ${d.notes?`<p style="font-size:12px;color:#555;white-space:pre-line;margin-top:16px">${esc(d.notes)}</p>`:''}</div>`;
  setTimeout(()=>window.print(),50);
}

let saved='';try{saved=sessionStorage.getItem(PK)||''}catch(e){}
load(saved);
})();
