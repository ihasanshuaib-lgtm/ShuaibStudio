<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شعيب استوديو | حجز باقة التصوير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0c0a;
    --bg-soft:#171310;
    --card:#1b1714;
    --card-hover:#221c17;
    --gold:#c9a463;
    --gold-light:#e3c98a;
    --gold-dim:#8a703f;
    --text:#efe6d8;
    --text-dim:#a89b87;
    --line:#332b22;
    --green:#5f8c6b;
  }
  body.light-mode{
    --bg:#faf6ee;
    --bg-soft:#f1e9d8;
    --card:#ffffff;
    --card-hover:#f7f1e3;
    --gold:#b8893f;
    --gold-light:#8a6526;
    --gold-dim:#cdab6f;
    --text:#2b2418;
    --text-dim:#7a6f5c;
    --line:#e4d8bd;
    --green:#3f7a50;
  }
  body.light-mode .badge{color:#fff;}
  body.light-mode .whatsapp-btn{color:#fff;}
  body.light-mode .confirm-btn{color:#fff;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,164,99,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
    transition:background .3s, color .3s;
  }
  .wrap{max-width:880px;margin:0 auto;padding:36px 20px 20px;}

  /* top bar */
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:24px;
  }
  .studio-logo{
    font-family:'Aref Ruqaa',serif;
    font-weight:700;
    font-size:30px;
    color:var(--gold-light);
    letter-spacing:1px;
    text-shadow:0 0 24px rgba(201,164,99,.25);
  }
  .theme-toggle{
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
    transition:border-color .2s, background .2s;
  }
  .theme-toggle:hover{border-color:var(--gold-dim);}
  .theme-toggle .icon-sun{display:none;}
  .theme-toggle .icon-moon{display:inline;}
  body.light-mode .theme-toggle .icon-sun{display:inline;}
  body.light-mode .theme-toggle .icon-moon{display:none;}

  /* معرض ثلاثي الأبعاد (Barrel / Helix / Ring / Sphere) */
  .gallery-section{margin-bottom:10px;}
  .gallery{
    position:relative;
    width:100%;
    height:min(62vw,420px);
    min-height:300px;
    overflow:hidden;
    perspective:1500px;
    touch-action:pan-y;
    cursor:grab;
    user-select:none;-webkit-user-select:none;
    border-radius:16px;
  }
  .gallery.grab{cursor:grabbing;}
  .gallery .scene{position:absolute;inset:0;transform-style:preserve-3d;}
  .gallery .card{
    position:absolute;left:50%;top:50%;
    width:var(--cw,150px);height:var(--ch,210px);
    margin-left:calc(var(--cw,150px) / -2);margin-top:calc(var(--ch,210px) / -2);
    background:var(--bg-soft);
    border:4px solid var(--card);
    border-radius:12px;
    box-shadow:0 12px 28px -8px rgba(0,0,0,.45);
    overflow:hidden;
    will-change:transform,opacity;
    display:flex;align-items:center;justify-content:center;
  }
  .gallery .scene.morph, .gallery .scene.morph .card{
    transition:transform .9s cubic-bezier(.16,.84,.3,1), opacity .9s ease;
  }
  /* صورة البطاقة: نسخة مصغّرة خفيفة من thumbs/ مع تحميل مؤجّل وفك ترميز غير معيق */
  .gallery .card img.ph{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:var(--bg-soft);
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .gallery .card .gp-icon{font-size:22px;color:var(--text-dim);opacity:.6;}
  .gallery .card .overlay{
    position:absolute;
    bottom:0;left:0;right:0;
    padding:10px 8px;
    color:#fff;
    background:linear-gradient(transparent, rgba(0,0,0,.75));
    opacity:0;
    transition:opacity .3s ease;
  }
  .gallery .card.active .overlay{opacity:1;}
  .gallery .card .overlay h3{
    font-family:'Aref Ruqaa',serif;
    font-size:15px;margin:0;color:var(--gold-light);
  }
  .gallery .card .overlay p{font-size:10px;margin:0;opacity:.9;}

  .gallery-bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;direction:ltr;
    padding:10px 4px 0;
  }
  .gallery-tabs{display:flex;gap:4px;flex-wrap:wrap;}
  .gallery-tab{
    font:600 12px 'Tajawal',sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-dim);background:transparent;border:1px solid transparent;
    padding:7px 11px;border-radius:8px;cursor:pointer;
  }
  .gallery-tab:hover{color:var(--text);}
  .gallery-tab[aria-selected="true"]{color:var(--gold-light);border-color:var(--gold-dim);background:var(--card);}
  .gallery-ctrl{display:flex;align-items:center;gap:8px;}
  .gallery-count{font:500 12px 'Tajawal',sans-serif;color:var(--text-dim);letter-spacing:.1em;font-variant-numeric:tabular-nums;}
  .gallery-btn{
    min-width:36px;height:36px;padding:0 10px;display:grid;place-items:center;
    background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;
    cursor:pointer;font:600 12px 'Tajawal',sans-serif;
  }
  .gallery-btn:hover{border-color:var(--gold-dim);}
  @media(max-width:640px){
    .gallery{min-height:280px;}
    .gallery-bar{justify-content:center;}
  }
  @media(prefers-reduced-motion:reduce){
    .gallery .scene.morph, .gallery .scene.morph .card{transition:none;}
  }

  /* تلميح يظهر أسفل الجلري عندما لا توجد صور للمجلد بعد */
  .gallery-hint{
    text-align:center;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.9;
    padding:0 12px 6px;
  }
  .gallery-hint b{color:var(--gold-light);font-weight:700;direction:ltr;display:inline-block;}


  /* header */
  header{text-align:center;margin-bottom:34px;}
  /* الشعار: logo.png أبيض على شفاف، فنلوّنه بالذهبي عبر mask ليظهر في الوضعين */
  .brand-logo{
    display:block;
    width:84px;height:100px;
    margin:0 auto 12px;
    background:var(--gold);
    -webkit-mask:url(logo.png) center/contain no-repeat;
    mask:url(logo.png) center/contain no-repeat;
  }
  .brand-mark{
    display:inline-flex;align-items:center;gap:10px;
    color:var(--gold-light);
    font-family:'Aref Ruqaa',serif;
    font-size:14px;letter-spacing:2px;
    margin-bottom:10px;
  }
  .brand-mark::before,.brand-mark::after{content:"";width:28px;height:1px;background:var(--gold-dim);}
  h1{
    font-family:'Aref Ruqaa',serif;
    font-weight:700;
    font-size:42px;
    margin:0 0 8px;
    color:var(--gold-light);
    text-shadow:0 0 30px rgba(201,164,99,.25);
  }
  header p.sub{color:var(--text-dim);font-size:15px;margin:0;}

  /* section titles */
  .section-title{
    display:flex;align-items:center;gap:12px;
    margin:38px 0 18px;
  }
  .section-title .num{
    font-family:'Aref Ruqaa',serif;
    color:var(--bg);
    background:var(--gold);
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;flex-shrink:0;
  }
  .section-title h2{
    font-size:19px;margin:0;color:var(--text);font-weight:700;
  }
  .section-title .line{flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent);}

  /* customer info */
  .info-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .info-card .full{grid-column:1 / -1;}
  .field label{
    display:block;font-size:13px;color:var(--gold-light);margin-bottom:7px;font-weight:500;
  }
  .field input{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 13px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .2s;
  }
  .field input:focus{border-color:var(--gold-dim);}
  .field input::placeholder{color:#5c5246;}
  .field input[type="date"],
  .field input[type="time"]{color-scheme:light;}
  body:not(.light-mode) .field input[type="date"],
  body:not(.light-mode) .field input[type="time"]{color-scheme:dark;}
  @media(max-width:560px){.info-card{grid-template-columns:1fr;}}

  /* categories: horizontally scrollable pill strip — always visible, easy to switch */
  .categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    overflow-y:hidden;
    padding-bottom:4px;
    scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  .categories::-webkit-scrollbar{height:5px;}
  .category{
    flex:0 0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:30px;
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:7px;
    text-align:center;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .2s, background .2s, transform .15s;
  }
  .category:hover{background:var(--card-hover);transform:translateY(-1px);}
  .category.selected{
    border-color:var(--gold);
    background:linear-gradient(135deg, rgba(201,164,99,.16), var(--card-hover));
    box-shadow:0 0 0 1px var(--gold) inset, 0 6px 18px -8px rgba(201,164,99,.35);
  }
  .category .cat-icon{font-size:16px;margin-bottom:0;}
  .category .cat-name{font-size:12px;font-weight:700;color:var(--text);}
  .category .cat-empty-tag{font-size:9px;color:var(--text-dim);margin-right:2px;}

  /* packages */
  .packages{display:flex;flex-direction:column;gap:14px;}
  .package{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    cursor:pointer;
    transition:border-color .2s, background .2s, transform .15s;
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .package:hover{background:var(--card-hover);}
  .package.selected{
    border-color:var(--gold);
    background:linear-gradient(135deg, rgba(201,164,99,.10), var(--card-hover));
    box-shadow:0 0 0 1px var(--gold) inset, 0 8px 24px -10px rgba(201,164,99,.3);
  }

  /* tier color coding removed per feedback — packages use default styling now */

  /* most-requested package gets a stronger, distinct highlight */
  .package.popular{
    border-color:var(--gold);
    background:linear-gradient(135deg, rgba(201,164,99,.16), var(--card));
    box-shadow:0 0 0 1.5px var(--gold) inset, 0 10px 30px -8px rgba(201,164,99,.45);
  }
  .package.popular.selected{
    box-shadow:0 0 0 2px var(--gold) inset, 0 12px 34px -8px rgba(201,164,99,.55);
  }
  .package input[type=radio]{display:none;}
  .radio-dot{
    width:20px;height:20px;border-radius:50%;
    border:2px solid var(--gold-dim);
    flex-shrink:0;margin-top:3px;
    position:relative;
    transition:border-color .2s;
  }
  .package.selected .radio-dot{border-color:var(--gold);}
  .package.selected .radio-dot::after{
    content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold);
  }
  .pkg-body{flex:1;}
  .pkg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .pkg-name{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
  .badge{
    font-size:11px;background:var(--gold);color:#1a1408;
    padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;
  }
  .pkg-price{
    font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--gold-light);font-weight:700;white-space:nowrap;
  }
  .pkg-price small{font-size:13px;color:var(--text-dim);font-family:'Tajawal',sans-serif;}
  .pkg-desc{color:var(--text-dim);font-size:13.5px;margin-top:6px;line-height:1.7;}

  .pkg-details-line{
    margin:8px 0 0;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.6;
  }

  /* services */
  .services{display:flex;flex-direction:column;gap:10px;}
  .service{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
    display:flex;align-items:center;gap:14px;
    cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .service:hover{background:var(--card-hover);}
  .service.selected{border-color:var(--gold-dim);background:var(--card-hover);}
  .service input[type=checkbox]{display:none;}
  .checkbox{
    width:20px;height:20px;border-radius:6px;
    border:2px solid var(--gold-dim);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .2s, background .2s;
  }
  .service.selected .checkbox{background:var(--gold);border-color:var(--gold);}
  .checkbox svg{width:12px;height:12px;opacity:0;transition:opacity .15s;}
  .service.selected .checkbox svg{opacity:1;}
  .srv-name{flex:1;font-size:14.5px;color:var(--text);}
  .srv-name .note{display:block;color:var(--text-dim);font-size:12px;margin-top:2px;}
  .srv-price{color:var(--gold-light);font-weight:700;font-size:14.5px;white-space:nowrap;font-family:'Aref Ruqaa',serif;}
  .qty-box{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 6px;
  }
  .qty-box button{
    width:24px;height:24px;border-radius:6px;border:none;
    background:var(--line);color:var(--text);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-box button:hover{background:var(--gold-dim);}
  .qty-box span{min-width:22px;text-align:center;font-size:13.5px;}

  /* summary card (now flows naturally at end of page) */
  .summary-card{
    background:var(--card);
    border:1px solid var(--gold-dim);
    border-radius:16px;
    padding:22px;
    margin-bottom:30px;
  }
  .summary-rows{font-size:13.5px;color:var(--text-dim);margin-bottom:14px;}
  .summary-rows div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);}
  .summary-rows div:last-child{border-bottom:none;}
  .summary-total{
    display:flex;flex-direction:column;gap:6px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .summary-total .row-line{display:flex;justify-content:space-between;align-items:center;}
  .summary-total .label{font-size:15px;font-weight:700;color:var(--text);}
  .summary-total .amount{font-family:'Aref Ruqaa',serif;font-size:30px;color:var(--gold-light);font-weight:700;}
  .summary-total .old-row{display:flex;justify-content:space-between;align-items:center;}
  .summary-total .old-row .old-label{font-size:13px;color:var(--text-dim);}
  .summary-total .old-row .old-amount{font-size:15px;color:var(--text-dim);text-decoration:line-through;}
  .summary-total .final-row{display:flex;justify-content:space-between;align-items:center;}
  .summary-total .final-row .final-label{font-size:15px;font-weight:700;color:var(--green);}
  .deposit-note{
    margin-top:10px;
    background:rgba(201,164,99,.08);
    border:1px dashed var(--gold-dim);
    border-radius:10px;
    padding:9px 12px;
    font-size:12.5px;
    color:var(--gold-light);
    text-align:center;
  }
  .confirm-btn{
    width:100%;margin-top:12px;
    background:var(--gold);
    color:#1a1408;
    border:none;border-radius:10px;
    padding:13px;
    font-size:15px;font-weight:700;
    font-family:'Tajawal',sans-serif;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .confirm-btn:hover{filter:brightness(1.1);}
  .confirm-btn:active{transform:scale(.98);}
  .confirm-btn:disabled{opacity:.4;cursor:not-allowed;}
  .send-row{display:flex;gap:10px;margin-top:12px;}
  .send-row .confirm-btn{margin-top:0;}
  .whatsapp-btn{background:#3fae5c;color:#08210f;}
  .email-btn{background:var(--bg-soft);color:var(--gold-light);border:1px solid var(--gold-dim);}
  .notes-field{margin-top:12px;}
  .notes-field label{font-size:12.5px;color:var(--gold-light);margin-bottom:6px;display:block;font-weight:500;}
  .notes-field textarea{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 13px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    outline:none;
    resize:vertical;
    min-height:54px;
    transition:border-color .2s;
  }
  .notes-field textarea:focus{border-color:var(--gold-dim);}
  .notes-field textarea::placeholder{color:#5c5246;}
  .info-card .field.full textarea{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 13px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    outline:none;
    resize:vertical;
    min-height:54px;
    transition:border-color .2s;
  }
  .info-card .field.full textarea:focus{border-color:var(--gold-dim);}
  .info-card .field.full textarea::placeholder{color:#5c5246;}

  .discount-field{margin-top:12px;}
  .discount-field label{font-size:12.5px;color:var(--gold-light);margin-bottom:6px;display:block;font-weight:500;}
  .discount-field input{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 13px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    outline:none;
    transition:border-color .2s;
  }
  .discount-field input:focus{border-color:var(--gold-dim);}
  .discount-field input::placeholder{color:#5c5246;}
  .discount-msg{font-size:12px;margin-top:6px;min-height:14px;}
  .discount-msg.valid{color:var(--green);}
  .discount-msg.invalid{color:#c25c5c;}
  .summary-total.has-discount .old-amount{
    font-size:14px;color:var(--text-dim);text-decoration:line-through;margin-left:8px;font-family:'Tajawal',sans-serif;
  }

  .empty-hint{font-size:13px;color:var(--text-dim);text-align:center;padding:6px 0;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body class="light-mode">

<div class="wrap">
  <div class="top-bar">
    <div class="studio-logo">شعيب استوديو</div>
    <button class="theme-toggle" id="themeToggle" title="تبديل المظهر">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
  </div>

  <header>
    <div class="brand-logo" role="img" aria-label="شعار شعيب استوديو"></div>
    <h1>حجز موعد التصوير</h1>
    <p class="sub">اختر باقتك وخدماتك الإضافية، وسنُجهّز كل التفاصيل لحفلتك</p>
  </header>

  <div class="section-title">
    <div class="num">١</div>
    <h2>نوع التصوير</h2>
    <div class="line"></div>
  </div>
  <div class="categories" id="categoriesList"></div>

  <div class="gallery-section" id="gallerySection" style="display:none;">
    <div class="section-title">
      <div class="num">🖼️</div>
      <h2 id="galleryTitle">من أعمالنا</h2>
      <div class="line"></div>
    </div>
    <div class="gallery" id="gallerySlideshow"><div class="scene" id="galleryScene"></div></div>
    <div class="gallery-bar" id="galleryBar">
      <div class="gallery-tabs" role="tablist" aria-label="شكل العرض">
        <button class="gallery-tab" role="tab" data-mode="helix" type="button">Helix</button>
        <button class="gallery-tab" role="tab" data-mode="barrel" type="button">Barrel</button>
        <button class="gallery-tab" role="tab" data-mode="ring" type="button">Ring</button>
        <button class="gallery-tab" role="tab" data-mode="sphere" type="button">Sphere</button>
      </div>
      <div class="gallery-ctrl">

// ============================================
// الصور المصغّرة (thumbs/) — للظهور السريع
// صور الكاميرا الأصلية 5–18 ميجابايت للصورة، وهي أكبر بكثير من حجم
// بطاقة الجلري (150×210 بكسل)، لذلك لا تُستخدم الأصلية هنا إطلاقًا.
// لكل صورة نسخة صغيرة (~50–130 كيلوبايت) في thumbs/<المجلد>/<الاسم>.jpg
// وتُولَّد بالأمر:  bash scripts/make-thumbs.sh
// إذا لم توجد المصغّرة يرجع الكود تلقائيًا إلى الصورة الأصلية.
// THUMB_VERSION: ارفعه عند إعادة توليد الصور ليتجاهل المتصفح النسخ القديمة.
// ============================================
const THUMB_DIR = 'thumbs/';
const THUMB_VERSION = '4';

// رابط الصورة المصغّرة المقابلة لصورة أصلية
// photos/DSC02717.jpg → thumbs/photos/DSC02717.jpg.jpg?v=1
function thumbUrl(src){
  const cut = src.lastIndexOf('/');
  const folder = cut === -1 ? '' : src.slice(0, cut + 1);
  const name = cut === -1 ? src : src.slice(cut + 1);
  return `${THUMB_DIR}${folder}${name}.jpg?v=${THUMB_VERSION}`;
}

// روابط بدأ تحميلها مسبقًا حتى يكون التنقّل بين الأنواع فوريًا
const preloadedThumbs = new Set();

// هل تسمح حالة الشبكة بالتحميل المسبق؟ (نحترم بيانات المستخدم)
function canPrefetch(){
  const c = navigator.connection;
  if(!c) return true;
  if(c.saveData) return false;
  return !/^(slow-2g|2g)$/.test(c.effectiveType || '');
}

// تحميل صور نوع معيّن في كاش المتصفح قبل أن يحتاجها المستخدم
function preloadThumbs(categoryKey, limit){
  if(!canPrefetch()) return;
  const conf = CATEGORY_PHOTOS[categoryKey];
  if(!conf || !conf.photos || !conf.photos.length) return;
  const folder = galleryFolder(categoryKey);
  conf.photos.slice(0, limit || GALLERY_COUNT).forEach(name=>{
    const url = thumbUrl(folder + encodeURI(name));
    if(preloadedThumbs.has(url)) return;
    preloadedThumbs.add(url);
    const im = new Image();
    im.decoding = 'async';
    im.src = url;
  });
}

// تسخين بقية الأنواع في وقت الفراغ (خطوة كل ثانية) حتى يصبح تبديل النوع فوريًا
function warmOtherCategories(){
  const keys = Object.keys(CATEGORY_PHOTOS).filter(k => k !== activeCategory);
  let i = 0;
  const step = ()=>{
    if(i >= keys.length) return;
    preloadThumbs(keys[i], GALLERY_COUNT);
    i++;
    setTimeout(step, 1000);
  };
  setTimeout(step, 800);
}

// مجلد صور نوع معين
function galleryFolder(categoryKey){
  const conf = CATEGORY_PHOTOS[categoryKey];
  return (conf && conf.folder) ? conf.folder : FALLBACK_FOLDER;
}

// خلط عشوائي (Fisher–Yates) واختيار عدد محدد من صور النوع الحالي
function pickRandomPhotos(categoryKey, count){
  const conf = CATEGORY_PHOTOS[categoryKey];
  const pool = (conf && conf.photos ? conf.photos : []).slice();
  // لا توجد صور في مجلد هذا النوع بعد → بطاقات فارغة (قريبًا)
  if(pool.length === 0) return new Array(count).fill(null);
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const folder = galleryFolder(categoryKey);
  return pool.slice(0, Math.min(count, pool.length)).map(name => folder + encodeURI(name));
}

let currentGalleryImages = [];

// محتوى بطاقة "قريبًا" (تُستخدم عند عدم وجود صورة)
function placeholderInner(num){
  return `
          <span class="gp-icon">📷</span>
          <div class="overlay">
            <h3>${num}</h3>
            <p>قريبًا</p>
          </div>`;
}

function buildGallerySlides(images){
  let html = '';
  images.forEach((src, i)=>{
    const num = String(i + 1).padStart(2, '0');
    if(src){
      const thumb = thumbUrl(src);
      // أول بطاقتين تُحمَّلان فورًا، والباقي عند الحاجة — مع فك ترميز غير معيق
      const priority = i < 2 ? 'eager' : 'lazy';
      html += `
        <div class="card" data-i="${i}" data-num="${num}">
          <img class="ph" src="${thumb}" alt="من أعمال شعيب استوديو" loading="${priority}" decoding="async" draggable="false" data-full="${src}">
          <div class="overlay">
            <h3>${num}</h3>
            <p>شعيب استوديو</p>
          </div>
        </div>`;
    } else {
      html += `
        <div class="card" data-i="${i}" data-num="${num}">
          ${placeholderInner(num)}
        </div>`;
    }
  });

  galleryScene.innerHTML = html;
  gCards = [...galleryScene.querySelectorAll('.card')];
  gN = gCards.length;
  gLastIdx = -1;

  galleryScene.querySelectorAll('img.ph').forEach(img=>{
    img.addEventListener('error', ()=> handleGalleryImageError(img));
  });
}

// صورة مفقودة: نجرّب الصورة الأصلية أولًا (إن لم تُولَّد المصغّرة بعد)،
// وإذا فشلت أيضًا تُستبدل البطاقة بـ"قريبًا" بدل صورة مكسورة
function handleGalleryImageError(img){
  const card = img.parentElement;
  if(img.dataset.triedFull !== '1' && img.dataset.full){
    img.dataset.triedFull = '1';
    img.removeAttribute('loading');
    img.src = img.dataset.full;
    return;
  }
  if(card) card.innerHTML = placeholderInner(card.dataset.num || '');
  else img.remove();
}

function galleryMeasure(){
  gSw = gallerySlideshow.clientWidth || 800;
  gSh = gallerySlideshow.clientHeight || 400;
  gCh = Math.max(140, Math.min(gSh * 0.56, gSw * 0.62));
  gCw = gCh * 0.75;
  gallerySlideshow.style.setProperty('--cw', gCw + 'px');
  gallerySlideshow.style.setProperty('--ch', gCh + 'px');
}

function gWrap(d){ const h = gN / 2; return ((d + h) % gN + gN) % gN - h; }
function gSmooth(a, b, v){ const k = Math.min(1, Math.max(0, (v - a) / (b - a))); return k * k * (3 - 2 * k); }

// وضع كل بطاقة في المجسّم حسب الشكل المختار
function galleryApply(){
  if(!gN) return;
  const step = Math.PI * 2 / gN;
  const rotY = gMx * 14, rotX = -gMy * 9;
  let R;
  if(gMode === 'barrel'){
    R = gN < 3 ? gCw * 1.2 : Math.max(gCw * 1.2, (gCw * 1.08) / (2 * Math.tan(Math.PI / gN)));
    galleryScene.style.transform = `translateZ(${-R}px) rotateX(${-8 + rotX}deg) rotateY(${rotY}deg)`;
  } else if(gMode === 'helix'){
    R = Math.max(gCw * 1.15, gCw * gN / 7);
    galleryScene.style.transform = `translateZ(${-R}px) rotateX(${-4 + rotX}deg) rotateY(${rotY}deg)`;
  } else if(gMode === 'sphere'){
    R = Math.max(gCw * 1.45, gCw * gN / 5.5);
    galleryScene.style.transform = `translateZ(${-R}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  } else {
    R = Math.min(900, Math.max(380, gSw * 0.5));
    galleryScene.style.transform = `translateY(${-gSh * 0.05}px) rotateX(${rotX * 0.5}deg) rotateY(${rotY * 0.5}deg)`;
  }
  const dy = Math.min(gCh * 0.3, (gSh * 0.8) / gN);
  for(let i = 0; i < gN; i++){
    const d = gWrap(i - gT), a = d * step, cs = Math.cos(a), sn = Math.sin(a);
    let tr, op;
    if(gMode === 'barrel'){
      tr = `rotateY(${a}rad) translateZ(${R}px)`;
      op = 0.18 + 0.82 * Math.pow((cs + 1) / 2, 0.8);
    } else if(gMode === 'helix'){
      tr = `translateY(${d * dy}px) rotateY(${a}rad) translateZ(${R}px)`;
      op = (0.18 + 0.82 * Math.pow((cs + 1) / 2, 0.8)) * (1 - Math.pow(Math.abs(d) / (gN / 2), 4));
    } else if(gMode === 'sphere'){
      const lat = 0.62 * Math.sin(3 * a);
      tr = `rotateY(${a}rad) rotateX(${lat}rad) translateZ(${R}px) scale(.85)`;
      op = 0.15 + 0.85 * Math.pow((cs * Math.cos(lat) + 1) / 2, 1.2);
    } else {
      tr = `translate3d(${R * sn}px,${R * (1 - cs)}px,0) rotateZ(${a}rad)`;
      op = 1 - gSmooth(1.2, 2.1, Math.abs(a));
    }
    const c = gCards[i];
    c.style.transform = tr;
    c.style.opacity = op.toFixed(3);
    c.style.zIndex = Math.round((1 - Math.abs(d) / (gN / 2)) * 100);
  }
  const idx = ((Math.round(gT) % gN) + gN) % gN;
  if(idx !== gLastIdx){
    gLastIdx = idx;
    gCards.forEach((el, k)=>el.classList.toggle('active', k === idx));
    galleryCount.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(gN).padStart(2, '0');
  }
}

function galleryFrame(now){
  gRaf = 0;
  if(!gVisible) return;                     // لا نرسم والقسم مخفي
  const dt = Math.min(0.05, (now - (gLastFrame || now)) / 1000);
  gLastFrame = now;
  if(gAuto && !gDragging) gTarget += GALLERY_SPEED * dt;
  gT += (gTarget - gT) * (1 - Math.exp(-dt * (gDragging ? 18 : 6)));
  if(!reduceMotion && now - gLastMove > 2500 && !gDragging){
    gTmx = Math.sin(now / 2600) * 0.45;
    gTmy = Math.cos(now / 3100) * 0.3;
  }
  const k = 1 - Math.exp(-dt * 4);
  gMx += (gTmx - gMx) * k;
  gMy += (gTmy - gMy) * k;
  galleryApply();
  gRaf = requestAnimationFrame(galleryFrame);
}

function galleryStartLoop(){
  gVisible = true;
  if(!gRaf){ gLastFrame = 0; gRaf = requestAnimationFrame(galleryFrame); }
}
function stopGallerySlideshow(){
  gVisible = false;
  if(gRaf){ cancelAnimationFrame(gRaf); gRaf = 0; }
}

function gallerySetMode(m){
  gMode = m;
  galleryTabs.forEach(b=>b.setAttribute('aria-selected', b.dataset.mode === m ? 'true' : 'false'));
  galleryScene.classList.add('morph');
  clearTimeout(gMorphTimer);
  gMorphTimer = setTimeout(()=>galleryScene.classList.remove('morph'), 950);
}
function gallerySetAuto(v){
  gAuto = v;
  galleryAutoBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
  galleryAutoBtn.innerHTML = v ? '&#10074;&#10074;' : '&#9654;';
  galleryAutoBtn.setAttribute('aria-label', v ? 'إيقاف الحركة' : 'تشغيل الحركة');
  if(!v) gTarget = Math.round(gTarget);
}
function galleryStep(dir){ gTarget = Math.round(gTarget) + dir; }
function galleryPps(){ return Math.max(90, gallerySlideshow.clientWidth / (gMode === 'ring' ? 3 : 5)); }

// ربط الأحداث مرة واحدة فقط
galleryTabs.forEach(b=>b.addEventListener('click', ()=>gallerySetMode(b.dataset.mode)));
document.getElementById('galleryPrev').addEventListener('click', ()=>galleryStep(-1));
document.getElementById('galleryNext').addEventListener('click', ()=>galleryStep(1));
galleryAutoBtn.addEventListener('click', ()=>gallerySetAuto(!gAuto));

gallerySlideshow.addEventListener('pointerdown', e=>{
  if(e.button > 0) return;
  gDragging = true; gMoved = 0; gLastX = e.clientX; gLastMove = performance.now();
  gDownCard = e.target.closest ? e.target.closest('.card') : null;
  gallerySlideshow.classList.add('grab');
});
window.addEventListener('pointermove', e=>{
  if(!gVisible) return;
  const r = gallerySlideshow.getBoundingClientRect();
  gTmx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
  gTmy = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
  gLastMove = performance.now();
  if(gDragging){
    const dx = e.clientX - gLastX; gLastX = e.clientX; gMoved += Math.abs(dx);
    gTarget -= dx / galleryPps();
  }
});
function galleryRelease(){
  if(!gDragging) return;
  gDragging = false; gallerySlideshow.classList.remove('grab');
  if(gMoved < 6 && gDownCard) gTarget += gWrap(+gDownCard.dataset.i - gTarget); // ضغطة على بطاقة = إبرازها
  else if(!gAuto) gTarget = Math.round(gTarget);
  gDownCard = null;
}
window.addEventListener('pointerup', galleryRelease);
window.addEventListener('pointercancel', galleryRelease);
window.addEventListener('resize', galleryMeasure);
if(window.ResizeObserver) new ResizeObserver(galleryMeasure).observe(gallerySlideshow);

function renderGallery(){
  if(!activeCategory){
    gallerySection.style.display = 'none';
    stopGallerySlideshow();
    return;
  }
  const g = GALLERIES[activeCategory];
  galleryTitle.textContent = g.title;
  // صور هذا النوع فقط، من مجلده الخاص، بترتيب عشوائي في كل مرة
  currentGalleryImages = pickRandomPhotos(activeCategory, GALLERY_COUNT);
  const hasPhotos = currentGalleryImages.some(Boolean);
  galleryHint.style.display = hasPhotos ? 'none' : 'block';
  galleryHint.innerHTML = hasPhotos ? '' :
    `لا توجد صور بعد في مجلد <b>${galleryFolder(activeCategory)}</b> — أضف صور هذا النوع هناك لتظهر هنا`;
  gallerySection.style.display = 'block';
  buildGallerySlides(currentGalleryImages);
  galleryMeasure();
  gT = gTarget = 0;
  gallerySetMode(gMode);
  gallerySetAuto(gAuto);
  galleryStartLoop();
}

renderGallery();

function fmt(n){
  return n.toLocaleString('en-US', {minimumFractionDigits: n % 1 === 0 ? 0 : (Number.isInteger(n*10) ? 1 : 3)}) ;
}
function money(n){
  // clean BHD formatting up to 3 decimals
  let s = n.toFixed(3).replace(/\.?0+$/,'');
  if(s.indexOf('.') === -1) s += '';
  return s + ' BD';
}

// اختيار نوع التصوير (يُستخدم عند الفتح وعند النقر)
function selectCategory(key){
  activeCategory = key;
  document.querySelectorAll('.category').forEach(el=>el.classList.remove('selected'));
  const card = document.getElementById('cat-'+key);
  if(card) card.classList.add('selected');
  selectedPackage = null;
  Object.keys(selectedServices).forEach(k=>delete selectedServices[k]);
  renderInfoCard();
  renderGallery();
  renderPackagesAndServices();
  update();
}

function renderPackagesAndServices(){
  packagesList.innerHTML = '';
  servicesList.innerHTML = '';

  if(!activeCategory){
    packagesList.innerHTML = '<div class="empty-hint">اختر نوع التصوير أولاً</div>';
    servicesList.innerHTML = '';
    return;
  }

  const cat = CATEGORIES[activeCategory];

  if(cat.packages.length === 0){
    packagesList.innerHTML = '<div class="empty-hint">سيتم إضافة باقات هذا النوع قريبًا</div>';
    return;
  }

  cat.packages.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'package' + (p.tier ? ` tier-${p.tier}` : '') + (p.badge ? ' popular' : '');
    div.id = 'pkg-'+p.id;
    const items = p.desc.split('+').map(s=>s.trim()).filter(Boolean);
    const itemsHtml = items.join(' + ');
    div.innerHTML = `
      <input type="radio" name="package" value="${p.id}">
      <div class="radio-dot"></div>
      <div class="pkg-body">
        <div class="pkg-top">
          <div class="pkg-name">${p.icon} ${p.name} ${p.badge ? `<span class="badge">${p.badge}</span>`:''}</div>
          <div class="pkg-price">${p.price} <small>BD</small></div>
        </div>
        <div class="pkg-details-line">${itemsHtml}</div>
      </div>
    `;
    div.addEventListener('click', ()=>{
      selectedPackage = p;
      document.querySelectorAll('.package').forEach(el=>el.classList.remove('selected'));
      div.classList.add('selected');
      update();
    });
    packagesList.appendChild(div);
  });

  if(cat.services.length === 0){
    servicesList.innerHTML = '';
    return;
  }

  cat.services.forEach(s=>{
    const div = document.createElement('div');
    div.className = 'service';
    div.id = 'srv-'+s.id;
    div.innerHTML = `
      <input type="checkbox" value="${s.id}">
      <div class="checkbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#1a1408" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="srv-name">${s.name}${s.note ? `<span class="note">${s.note}</span>`:''}</div>
      ${s.perUnit ? `<div class="qty-box" data-id="${s.id}">
          <button type="button" class="dec">−</button>
          <span class="qty">0</span>
          <button type="button" class="inc">+</button>
        </div>` : ''}
      <div class="srv-price">${s.price} BD</div>
    `;

    if(s.perUnit){
      const qtyBox = div.querySelector('.qty-box');
      const qtySpan = div.querySelector('.qty');
      qtyBox.querySelector('.inc').addEventListener('click', (e)=>{
        e.preventDefault(); e.stopPropagation();
        const qty = (selectedServices[s.id]?.qty || 0) + 1;
        selectedServices[s.id] = {qty};
        qtySpan.textContent = qty;
        div.classList.add('selected');
        update();
      });
      qtyBox.querySelector('.dec').addEventListener('click', (e)=>{
        e.preventDefault(); e.stopPropagation();
        let qty = (selectedServices[s.id]?.qty || 0) - 1;
        if(qty <= 0){ qty = 0; delete selectedServices[s.id]; div.classList.remove('selected'); }
        else { selectedServices[s.id] = {qty}; }
        qtySpan.textContent = qty;
        update();
      });
    } else {
      div.addEventListener('click', (e)=>{
        if(selectedServices[s.id]){
          delete selectedServices[s.id];
          div.classList.remove('selected');
        } else {
          selectedServices[s.id] = {qty:1};
          div.classList.add('selected');
        }
        update();
      });
    }
    servicesList.appendChild(div);
  });
}

renderPackagesAndServices();

const DISCOUNT_CODES = {
  'm10': 0.10,
  'f15': 0.15,
};

const summaryRows = document.getElementById('summaryRows');
const totalAmount = document.getElementById('totalAmount');

const sendEmail = document.getElementById('sendEmail');
const discountInput = document.getElementById('discountCode');
const discountMsg = document.getElementById('discountMsg');

function getDiscountRate(){
  const code = discountInput.value.trim().toLowerCase();
  if(!code) { discountMsg.textContent=''; discountMsg.className='discount-msg'; return 0; }
  if(DISCOUNT_CODES.hasOwnProperty(code)){
    const pct = DISCOUNT_CODES[code]*100;
    discountMsg.textContent = `تم تطبيق خصم ${pct}% ✓`;
    discountMsg.className = 'discount-msg valid';
    return DISCOUNT_CODES[code];
  }
  discountMsg.textContent = 'الكود غير صحيح';
  discountMsg.className = 'discount-msg invalid';
  return 0;
}

discountInput.addEventListener('input', update);

function currentServices(){
  return activeCategory ? CATEGORIES[activeCategory].services : [];
}

function calcRawTotal(){
  let total = 0;
  if(selectedPackage) total += selectedPackage.price;
  currentServices().forEach(s=>{
    if(selectedServices[s.id]){
      const qty = selectedServices[s.id].qty;
      total += s.perUnit ? s.price * qty : s.price;
    }
  });
  return total;
}

function update(){
  let rows = [];

  if(selectedPackage){
    rows.push(`<div><span>${selectedPackage.icon} ${selectedPackage.name}</span><span>${selectedPackage.price} BD</span></div>`);
  }

  currentServices().forEach(s=>{
    if(selectedServices[s.id]){
      const qty = selectedServices[s.id].qty;
      const lineTotal = s.perUnit ? s.price * qty : s.price;
      const label = s.perUnit ? `${s.name} ×${qty}` : s.name;
      rows.push(`<div><span>${label}</span><span>${lineTotal.toFixed(s.perUnit ? 1 : 0).replace(/\.0$/,'')} BD</span></div>`);
    }
  });

  summaryRows.innerHTML = rows.length ? rows.join('') : '<div class="empty-hint">اختر باقة لعرض التفاصيل</div>';

  const rawTotal = calcRawTotal();
  const rate = getDiscountRate();
  const finalTotal = rawTotal * (1 - rate);
  const totalBox = document.getElementById('summaryTotalBox');

  if(rate > 0 && rawTotal > 0){
    totalBox.innerHTML = `
      <div class="old-row">
        <span class="old-label">المبلغ قبل الخصم</span>
        <span class="old-amount">${money(rawTotal)}</span>
      </div>
      <div class="final-row">
        <span class="final-label">المبلغ بعد الخصم</span>
        <span class="amount">${money(finalTotal)}</span>
      </div>`;
  } else {
    totalBox.innerHTML = `
      <div class="row-line">
        <span class="label">المبلغ الكلي</span>
        <span class="amount">${money(finalTotal)}</span>
      </div>`;
  }

  sendWhatsapp.disabled = !selectedPackage;
  sendEmail.disabled = !selectedPackage;
}

  lines.push(``);
  if(rate > 0){
    lines.push(`المبلغ قبل الخصم: ${money(total)}`, `كود الخصم: ${discountInput.value.trim()} (${rate*100}%)`, `المبلغ الكلي بعد الخصم: ${money(finalTotal)}`);
  } else {
    lines.push(`المبلغ الكلي: ${money(finalTotal)}`);
  }
  lines.push(`المبلغ المقدم (50%): ${money(finalTotal/2)}`);

  const notes = document.getElementById('custNotes').value.trim();
  if(notes){
    lines.push(``, `ملاحظات: ${notes}`);
  }

  lines.push(``, `سيتم حجز موعد التصوير بعد دفع نصف المبلغ مقدمًا`);

  return lines.join('\n');
}

sendWhatsapp.addEventListener('click', ()=>{
  const msg = buildMessage();
  if(!msg) return;
  const url = `https://wa.me/${STUDIO_WHATSAPP}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
});

sendEmail.addEventListener('click', ()=>{
  const msg = buildMessage();
  if(!msg) return;
  const subject = encodeURIComponent('طلب حجز جديد - شعيب استوديو');
  const body = encodeURIComponent(msg);
  window.location.href = `mailto:${STUDIO_EMAIL}?subject=${subject}&body=${body}`;
});

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
