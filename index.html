<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شعيب استوديو | حجز باقة التصوير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0c0a;
    --bg-soft:#171310;
    --card:#1b1714;
    --card-hover:#221c17;
    --gold:#c9a463;
    --gold-light:#e3c98a;
    --gold-dim:#8a703f;
    --text:#efe6d8;
    --text-dim:#a89b87;
    --line:#332b22;
    --green:#5f8c6b;
  }
  body.light-mode{
    --bg:#faf6ee;
    --bg-soft:#f1e9d8;
    --card:#ffffff;
    --card-hover:#f7f1e3;
    --gold:#b8893f;
    --gold-light:#8a6526;
    --gold-dim:#cdab6f;
    --text:#2b2418;
    --text-dim:#7a6f5c;
    --line:#e4d8bd;
    --green:#3f7a50;
  }
  body.light-mode .badge{color:#fff;}
  body.light-mode .whatsapp-btn{color:#fff;}
  body.light-mode .confirm-btn{color:#fff;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,164,99,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
    transition:background .3s, color .3s;
  }
  .wrap{max-width:880px;margin:0 auto;padding:36px 20px 20px;}

  /* top bar */
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:24px;
  }
  .studio-logo{
    font-family:'Aref Ruqaa',serif;
    font-weight:700;
    font-size:30px;
    color:var(--gold-light);
    letter-spacing:1px;
    text-shadow:0 0 24px rgba(201,164,99,.25);
  }
  .theme-toggle{
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
    transition:border-color .2s, background .2s;
  }
  .theme-toggle:hover{border-color:var(--gold-dim);}
  .theme-toggle .icon-sun{display:none;}
  .theme-toggle .icon-moon{display:inline;}
  body.light-mode .theme-toggle .icon-sun{display:inline;}
  body.light-mode .theme-toggle .icon-moon{display:none;}

  .hero-img{
    position:relative;
    width:100%;
    max-width:880px;
    margin:0 auto 30px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }
  .hero-img img{
    width:100%;
    display:block;
    max-height:420px;
    object-fit:cover;
  }
  .hero-overlay{
    position:absolute;inset:0;
    background:linear-gradient(to top, var(--bg) 2%, transparent 35%);
  }

  /* header */
  header{text-align:center;margin-bottom:34px;}
  .brand-mark{
    display:inline-flex;align-items:center;gap:10px;
    color:var(--gold-light);
    font-family:'Aref Ruqaa',serif;
    font-size:14px;letter-spacing:2px;
    margin-bottom:10px;
  }
  .brand-mark::before,.brand-mark::after{content:"";width:28px;height:1px;background:var(--gold-dim);}
  h1{
    font-family:'Aref Ruqaa',serif;
    font-weight:700;
    font-size:42px;
    margin:0 0 8px;
    color:var(--gold-light);
    text-shadow:0 0 30px rgba(201,164,99,.25);
  }
  header p.sub{color:var(--text-dim);font-size:15px;margin:0;}

  /* section titles */
  .section-title{
    display:flex;align-items:center;gap:12px;
    margin:38px 0 18px;
  }
  .section-title .num{
    font-family:'Aref Ruqaa',serif;
    color:var(--bg);
    background:var(--gold);
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;flex-shrink:0;
  }
  .section-title h2{
    font-size:19px;margin:0;color:var(--text);font-weight:700;
  }
  .section-title .line{flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent);}

  /* customer info */
  .info-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .info-card .full{grid-column:1 / -1;}
  .field label{
    display:block;font-size:13px;color:var(--gold-light);margin-bottom:7px;font-weight:500;
  }
  .field input{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 13px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .2s;
  }
  .field input:focus{border-color:var(--gold-dim);}
  .field input::placeholder{color:#5c5246;}
  @media(max-width:560px){.info-card{grid-template-columns:1fr;}}

  /* packages */
  .packages{display:flex;flex-direction:column;gap:14px;}
  .package{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    cursor:pointer;
    transition:border-color .2s, background .2s, transform .15s;
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .package:hover{background:var(--card-hover);}
  .package.selected{
    border-color:var(--gold);
    background:linear-gradient(135deg, rgba(201,164,99,.10), var(--card-hover));
    box-shadow:0 0 0 1px var(--gold) inset, 0 8px 24px -10px rgba(201,164,99,.3);
  }
  .package input[type=radio]{display:none;}
  .radio-dot{
    width:20px;height:20px;border-radius:50%;
    border:2px solid var(--gold-dim);
    flex-shrink:0;margin-top:3px;
    position:relative;
    transition:border-color .2s;
  }
  .package.selected .radio-dot{border-color:var(--gold);}
  .package.selected .radio-dot::after{
    content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold);
  }
  .pkg-body{flex:1;}
  .pkg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .pkg-name{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
  .badge{
    font-size:11px;background:var(--gold);color:#1a1408;
    padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;
  }
  .pkg-price{
    font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--gold-light);font-weight:700;white-space:nowrap;
  }
  .pkg-price small{font-size:13px;color:var(--text-dim);font-family:'Tajawal',sans-serif;}
  .pkg-desc{color:var(--text-dim);font-size:13.5px;margin-top:6px;line-height:1.7;}

  /* services */
  .services{display:flex;flex-direction:column;gap:10px;}
  .service{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
    display:flex;align-items:center;gap:14px;
    cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .service:hover{background:var(--card-hover);}
  .service.selected{border-color:var(--gold-dim);background:var(--card-hover);}
  .service input[type=checkbox]{display:none;}
  .checkbox{
    width:20px;height:20px;border-radius:6px;
    border:2px solid var(--gold-dim);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .2s, background .2s;
  }
  .service.selected .checkbox{background:var(--gold);border-color:var(--gold);}
  .checkbox svg{width:12px;height:12px;opacity:0;transition:opacity .15s;}
  .service.selected .checkbox svg{opacity:1;}
  .srv-name{flex:1;font-size:14.5px;color:var(--text);}
  .srv-name .note{display:block;color:var(--text-dim);font-size:12px;margin-top:2px;}
  .srv-price{color:var(--gold-light);font-weight:700;font-size:14.5px;white-space:nowrap;font-family:'Aref Ruqaa',serif;}
  .qty-box{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:4px 6px;
  }
  .qty-box button{
    width:24px;height:24px;border-radius:6px;border:none;
    background:var(--line);color:var(--text);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-box button:hover{background:var(--gold-dim);}
  .qty-box span{min-width:22px;text-align:center;font-size:13.5px;}

  /* summary card (now flows naturally at end of page) */
  .summary-card{
    background:var(--card);
    border:1px solid var(--gold-dim);
    border-radius:16px;
    padding:22px;
    margin-bottom:30px;
  }
  .summary-rows{font-size:13.5px;color:var(--text-dim);margin-bottom:14px;}
  .summary-rows div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);}
  .summary-rows div:last-child{border-bottom:none;}
  .summary-total{
    display:flex;flex-direction:column;gap:6px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .summary-total .row-line{display:flex;justify-content:space-between;align-items:center;}
  .summary-total .label{font-size:15px;font-weight:700;color:var(--text);}
  .summary-total .amount{font-family:'Aref Ruqaa',serif;font-size:30px;color:var(--gold-light);font-weight:700;}
  .summary-total .old-row{display:flex;justify-content:space-between;align-items:center;}
  .summary-total .old-row .old-label{font-size:13px;color:var(--text-dim);}
  .summary-total .old-row .old-amount{font-size:15px;color:var(--text-dim);text-decoration:line-through;}
  .summary-total .final-row{display:flex;justify-content:space-between;align-items:center;}
  .summary-total .final-row .final-label{font-size:15px;font-weight:700;color:var(--green);}
  .deposit-note{
    margin-top:10px;
    background:rgba(201,164,99,.08);
    border:1px dashed var(--gold-dim);
    border-radius:10px;
    padding:9px 12px;
    font-size:12.5px;
    color:var(--gold-light);
    text-align:center;
  }
  .confirm-btn{
    width:100%;margin-top:12px;
    background:var(--gold);
    color:#1a1408;
    border:none;border-radius:10px;
    padding:13px;
    font-size:15px;font-weight:700;
    font-family:'Tajawal',sans-serif;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .confirm-btn:hover{filter:brightness(1.1);}
  .confirm-btn:active{transform:scale(.98);}
  .confirm-btn:disabled{opacity:.4;cursor:not-allowed;}
  .send-row{display:flex;gap:10px;margin-top:12px;}
  .send-row .confirm-btn{margin-top:0;}
  .whatsapp-btn{background:#3fae5c;color:#08210f;}
  .email-btn{background:var(--bg-soft);color:var(--gold-light);border:1px solid var(--gold-dim);}
  .notes-field{margin-top:12px;}
  .notes-field label{font-size:12.5px;color:var(--gold-light);margin-bottom:6px;display:block;font-weight:500;}
  .notes-field textarea{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 13px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    outline:none;
    resize:vertical;
    min-height:54px;
    transition:border-color .2s;
  }
  .notes-field textarea:focus{border-color:var(--gold-dim);}
  .notes-field textarea::placeholder{color:#5c5246;}
  .info-card .field.full textarea{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 13px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    outline:none;
    resize:vertical;
    min-height:54px;
    transition:border-color .2s;
  }
  .info-card .field.full textarea:focus{border-color:var(--gold-dim);}
  .info-card .field.full textarea::placeholder{color:#5c5246;}

  .discount-field{margin-top:12px;}
  .discount-field label{font-size:12.5px;color:var(--gold-light);margin-bottom:6px;display:block;font-weight:500;}
  .discount-field input{
    width:100%;
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 13px;
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    outline:none;
    transition:border-color .2s;
  }
  .discount-field input:focus{border-color:var(--gold-dim);}
  .discount-field input::placeholder{color:#5c5246;}
  .discount-msg{font-size:12px;margin-top:6px;min-height:14px;}
  .discount-msg.valid{color:var(--green);}
  .discount-msg.invalid{color:#c25c5c;}
  .summary-total.has-discount .old-amount{
    font-size:14px;color:var(--text-dim);text-decoration:line-through;margin-left:8px;font-family:'Tajawal',sans-serif;
  }

  .empty-hint{font-size:13px;color:var(--text-dim);text-align:center;padding:6px 0;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body class="light-mode">

<div class="wrap">
  <div class="top-bar">
    <div class="studio-logo">شعيب استوديو</div>
    <button class="theme-toggle" id="themeToggle" title="تبديل المظهر">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
  </div>

  <div class="hero-img">
    <img src="hero.jpg" alt="نموذج من تصوير شعيب استوديو">
    <div class="hero-overlay"></div>
  </div>

  <header>
    <h1>حجز موعد التصوير</h1>
    <p class="sub">اختر باقتك وخدماتك الإضافية، وسنُجهّز كل التفاصيل لحفلتك</p>
  </header>

  <div class="section-title">
    <div class="num">١</div>
    <h2>بيانات العميل</h2>
    <div class="line"></div>
  </div>
  <div class="info-card">
    <div class="field full">
      <label>الاسم الكامل</label>
      <input type="text" id="custName" placeholder="اسم العريس / العميل">
    </div>
    <div class="field">
      <label>تاريخ التصوير</label>
      <input type="text" id="custDate" placeholder="مثال: 25 ديسمبر 2026">
    </div>
    <div class="field">
      <label>وقت التصوير</label>
      <input type="text" id="custTime" placeholder="مثال: 7:00 مساءً">
    </div>
    <div class="field full">
      <label>ملاحظات إضافية (اختياري)</label>
      <textarea id="custNotes" placeholder="أي تفاصيل أو طلبات خاصة تريد إضافتها..."></textarea>
    </div>
  </div>

  <div class="section-title">
    <div class="num">٢</div>
    <h2>اختر الباقة</h2>
    <div class="line"></div>
  </div>
  <div class="packages" id="packagesList"></div>

  <div class="section-title">
    <div class="num">٣</div>
    <h2>خدمات إضافية</h2>
    <div class="line"></div>
  </div>
  <div class="services" id="servicesList"></div>

  <div class="section-title">
    <div class="num">٤</div>
    <h2>ملخص الحجز</h2>
    <div class="line"></div>
  </div>
  <div class="summary-card">
    <div class="summary-rows" id="summaryRows">
      <div class="empty-hint">اختر باقة لعرض التفاصيل</div>
    </div>
    <div class="summary-total" id="summaryTotalBox">
      <span class="label">المبلغ الكلي</span>
      <span class="amount" id="totalAmount">0.000 BD</span>
    </div>
    <div class="field discount-field">
      <label>كود الخصم (اختياري)</label>
      <input type="text" id="discountCode" placeholder="أدخل الكود إن وجد">
      <div class="discount-msg" id="discountMsg"></div>
    </div>
    <div class="deposit-note">سيتم حجز موعد التصوير بعد دفع نصف المبلغ مقدمًا</div>
    <div class="send-row">
      <button class="confirm-btn whatsapp-btn" id="sendWhatsapp" disabled>إرسال الحجز عبر واتساب</button>
      <button class="confirm-btn email-btn" id="sendEmail" disabled>إرسال الحجز عبر البريد</button>
    </div>
  </div>
</div>

<script>
const packages = [
  {id:'p1', name:'باقة الذكريات', icon:'📸', price:60, desc:'تصوير فوتوغرافي مع بطاقة دعوة'},
  {id:'p2', name:'باقة الذكريات بلس', icon:'📸', price:85, desc:'تصوير فوتو + فيديو + مقابلات'},
  {id:'p3', name:'باقة الفخامة', icon:'⭐', price:99, desc:'فوتو + فيديو + مقابلات + بطاقة دعوة', badge:'الأكثر طلباً'},
  {id:'p4', name:'باقة الفخامة بلس', icon:'💌', price:120, desc:'فوتو + فيديو + مقابلات + برومو + بطاقة دعوة'},
  {id:'p5', name:'باقة فيلم العمر', icon:'🎬', price:150, desc:'جميع المميزات + تصوير شخصي + فيديو سينمائي + برومو لتفاصيل كشخة المعرس + طباعة صور'},
];

const services = [
  {id:'s1', name:'تصوير بطاقة الدعوة في منزل المعرس', price:10},
  {id:'s2', name:'تصوير فيديو ثابت طوال مدة الحفل', price:12},
  {id:'s3', name:'تصوير جوال / ريلز', price:8},
  {id:'s4', name:'طباعة الصور', price:0.5, perUnit:true, unitLabel:'لكل صورة'},
  {id:'s5', name:'خدمة توصيل USB أو الصور المطبوعة', price:2},
  {id:'s6', name:'خدمة الباركود الفوري للصور', note:'باركود QR يتيح للضيوف الوصول فورًا لجميع الصور', price:10},
  {id:'s7', name:'مونتاج لكواليس الحفل العفوية', price:5},
  {id:'s8', name:'تعديل الصور الاحترافي', price:10},
  {id:'s9', name:'تصوير أبو المعرس - كاميرا إضافية', price:20},
  {id:'s10', name:'تصوير 360 للحفل', price:10},
];

// ============================================
// إعدادات الاستوديو — عدّل القيمتين هنا فقط
// ============================================
const STUDIO_WHATSAPP = "97336659456"; // رقم الاستوديو مع رمز البحرين 973
const STUDIO_EMAIL = "studio@example.com";
// ============================================

const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', ()=>{
  document.body.classList.toggle('light-mode');
});

let selectedPackage = null;
const selectedServices = {}; // id -> {qty}

const packagesList = document.getElementById('packagesList');
const servicesList = document.getElementById('servicesList');

function fmt(n){
  return n.toLocaleString('en-US', {minimumFractionDigits: n % 1 === 0 ? 0 : (Number.isInteger(n*10) ? 1 : 3)}) ;
}
function money(n){
  // clean BHD formatting up to 3 decimals
  let s = n.toFixed(3).replace(/\.?0+$/,'');
  if(s.indexOf('.') === -1) s += '';
  return s + ' BD';
}

packages.forEach(p=>{
  const div = document.createElement('div');
  div.className = 'package';
  div.id = 'pkg-'+p.id;
  div.innerHTML = `
    <input type="radio" name="package" value="${p.id}">
    <div class="radio-dot"></div>
    <div class="pkg-body">
      <div class="pkg-top">
        <div class="pkg-name">${p.icon} ${p.name} ${p.badge ? `<span class="badge">${p.badge}</span>`:''}</div>
        <div class="pkg-price">${p.price} <small>BD</small></div>
      </div>
      <div class="pkg-desc">${p.desc}</div>
    </div>
  `;
  div.addEventListener('click', ()=>{
    selectedPackage = p;
    document.querySelectorAll('.package').forEach(el=>el.classList.remove('selected'));
    div.classList.add('selected');
    update();
  });
  packagesList.appendChild(div);
});

services.forEach(s=>{
  const div = document.createElement('div');
  div.className = 'service';
  div.id = 'srv-'+s.id;
  div.innerHTML = `
    <input type="checkbox" value="${s.id}">
    <div class="checkbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#1a1408" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="srv-name">${s.name}${s.note ? `<span class="note">${s.note}</span>`:''}</div>
    ${s.perUnit ? `<div class="qty-box" data-id="${s.id}">
        <button type="button" class="dec">−</button>
        <span class="qty">0</span>
        <button type="button" class="inc">+</button>
      </div>` : ''}
    <div class="srv-price">${s.perUnit ? s.price+' BD' : s.price+' BD'}</div>
  `;

  if(s.perUnit){
    const qtyBox = div.querySelector('.qty-box');
    const qtySpan = div.querySelector('.qty');
    qtyBox.querySelector('.inc').addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const qty = (selectedServices[s.id]?.qty || 0) + 1;
      selectedServices[s.id] = {qty};
      qtySpan.textContent = qty;
      div.classList.add('selected');
      update();
    });
    qtyBox.querySelector('.dec').addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      let qty = (selectedServices[s.id]?.qty || 0) - 1;
      if(qty <= 0){ qty = 0; delete selectedServices[s.id]; div.classList.remove('selected'); }
      else { selectedServices[s.id] = {qty}; }
      qtySpan.textContent = qty;
      update();
    });
  } else {
    div.addEventListener('click', (e)=>{
      if(selectedServices[s.id]){
        delete selectedServices[s.id];
        div.classList.remove('selected');
      } else {
        selectedServices[s.id] = {qty:1};
        div.classList.add('selected');
      }
      update();
    });
  }
  servicesList.appendChild(div);
});

const DISCOUNT_CODES = {
  'm10': 0.10,
  'f15': 0.15,
};

const summaryRows = document.getElementById('summaryRows');
const totalAmount = document.getElementById('totalAmount');
const sendWhatsapp = document.getElementById('sendWhatsapp');
const sendEmail = document.getElementById('sendEmail');
const discountInput = document.getElementById('discountCode');
const discountMsg = document.getElementById('discountMsg');

function getDiscountRate(){
  const code = discountInput.value.trim().toLowerCase();
  if(!code) { discountMsg.textContent=''; discountMsg.className='discount-msg'; return 0; }
  if(DISCOUNT_CODES.hasOwnProperty(code)){
    const pct = DISCOUNT_CODES[code]*100;
    discountMsg.textContent = `تم تطبيق خصم ${pct}% ✓`;
    discountMsg.className = 'discount-msg valid';
    return DISCOUNT_CODES[code];
  }
  discountMsg.textContent = 'الكود غير صحيح';
  discountMsg.className = 'discount-msg invalid';
  return 0;
}

discountInput.addEventListener('input', update);

function calcRawTotal(){
  let total = 0;
  if(selectedPackage) total += selectedPackage.price;
  services.forEach(s=>{
    if(selectedServices[s.id]){
      const qty = selectedServices[s.id].qty;
      total += s.perUnit ? s.price * qty : s.price;
    }
  });
  return total;
}

function update(){
  let rows = [];

  if(selectedPackage){
    rows.push(`<div><span>${selectedPackage.icon} ${selectedPackage.name}</span><span>${selectedPackage.price} BD</span></div>`);
  }

  services.forEach(s=>{
    if(selectedServices[s.id]){
      const qty = selectedServices[s.id].qty;
      const lineTotal = s.perUnit ? s.price * qty : s.price;
      const label = s.perUnit ? `${s.name} ×${qty}` : s.name;
      rows.push(`<div><span>${label}</span><span>${lineTotal.toFixed(s.perUnit ? 1 : 0).replace(/\.0$/,'')} BD</span></div>`);
    }
  });

  summaryRows.innerHTML = rows.length ? rows.join('') : '<div class="empty-hint">اختر باقة لعرض التفاصيل</div>';

  const rawTotal = calcRawTotal();
  const rate = getDiscountRate();
  const finalTotal = rawTotal * (1 - rate);
  const totalBox = document.getElementById('summaryTotalBox');

  if(rate > 0 && rawTotal > 0){
    totalBox.innerHTML = `
      <div class="old-row">
        <span class="old-label">المبلغ قبل الخصم</span>
        <span class="old-amount">${money(rawTotal)}</span>
      </div>
      <div class="final-row">
        <span class="final-label">المبلغ بعد الخصم</span>
        <span class="amount">${money(finalTotal)}</span>
      </div>`;
  } else {
    totalBox.innerHTML = `
      <div class="row-line">
        <span class="label">المبلغ الكلي</span>
        <span class="amount">${money(finalTotal)}</span>
      </div>`;
  }

  sendWhatsapp.disabled = !selectedPackage;
  sendEmail.disabled = !selectedPackage;
}

function buildMessage(){
  const name = document.getElementById('custName').value.trim();
  const date = document.getElementById('custDate').value;
  const time = document.getElementById('custTime').value;

  if(!name || !date || !time){
    alert('يرجى تعبئة الاسم وتاريخ ووقت التصوير قبل الإرسال');
    return null;
  }
  if(!selectedPackage){
    alert('يرجى اختيار الباقة');
    return null;
  }

  let total = selectedPackage.price;
  let lines = [
    `*طلب حجز جديد - شعيب استوديو*`,
    `الاسم: ${name}`,
    `تاريخ التصوير: ${date}`,
    `وقت التصوير: ${time}`,
    ``,
    `الباقة: ${selectedPackage.icon} ${selectedPackage.name} - ${selectedPackage.price} BD`
  ];

  services.forEach(s=>{
    if(selectedServices[s.id]){
      const qty = selectedServices[s.id].qty;
      const lineTotal = s.perUnit ? s.price * qty : s.price;
      total += lineTotal;
      lines.push(`${s.name}${s.perUnit ? ' ×'+qty : ''}: ${lineTotal.toFixed(s.perUnit?1:0).replace(/\.0$/,'')} BD`);
    }
  });

  const rate = getDiscountRate();
  const finalTotal = total * (1 - rate);

  lines.push(``);
  if(rate > 0){
    lines.push(`المبلغ قبل الخصم: ${money(total)}`, `كود الخصم: ${discountInput.value.trim()} (${rate*100}%)`, `المبلغ الكلي بعد الخصم: ${money(finalTotal)}`);
  } else {
    lines.push(`المبلغ الكلي: ${money(finalTotal)}`);
  }
  lines.push(`المبلغ المقدم (50%): ${money(finalTotal/2)}`);

  const notes = document.getElementById('custNotes').value.trim();
  if(notes){
    lines.push(``, `ملاحظات: ${notes}`);
  }

  lines.push(``, `سيتم حجز موعد التصوير بعد دفع نصف المبلغ مقدمًا`);

  return lines.join('\n');
}

sendWhatsapp.addEventListener('click', ()=>{
  const msg = buildMessage();
  if(!msg) return;
  const url = `https://wa.me/${STUDIO_WHATSAPP}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
});

sendEmail.addEventListener('click', ()=>{
  const msg = buildMessage();
  if(!msg) return;
  const subject = encodeURIComponent('طلب حجز جديد - شعيب استوديو');
  const body = encodeURIComponent(msg);
  window.location.href = `mailto:${STUDIO_EMAIL}?subject=${subject}&body=${body}`;
});

update();
</script>
