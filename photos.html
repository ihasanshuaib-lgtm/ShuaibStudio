<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شعيب استوديو | المزيد من الصور</title>
<script src="photos-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efebe6;--card:#ebe6df;--soft:#e4ded6;--line:#ddd5cb;
  --text:#5a524b;--dim:#8a8178;--gold:#9a6f66;--accent:#789680;
  --sh-l:#ffffff;--sh-d:#d3cbc1;
  --lift:6px 6px 14px var(--sh-d),-6px -6px 14px var(--sh-l);
  --lift-sm:3px 3px 8px var(--sh-d),-3px -3px 8px var(--sh-l);
  --sunk:inset 3px 3px 7px #d6cec4,inset -3px -3px 7px #fbf9f6;
  --card-g:linear-gradient(145deg,#f4f0eb,#e7e1d9);
  --btn-sage:linear-gradient(145deg,#9fb8a4,#86a08b);
}
*{box-sizing:border-box;margin:0}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--text);min-height:100vh;padding-bottom:40px;
  background:radial-gradient(ellipse at 50% 0%,#f6f3ef 0%,#efebe6 55%,#e8e2db 100%) fixed}
button,a{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:12px 16px;margin:0 -16px 16px;background:rgba(240,236,231,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.7);box-shadow:0 8px 22px -12px var(--sh-d)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:.6rem 1.1rem;border-radius:12px;border:1px solid #fff;background:var(--card-g);box-shadow:var(--lift-sm);cursor:pointer;text-decoration:none;font-weight:600;font-size:.92rem;transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:var(--sunk)}
.btn.pri{background:var(--btn-sage);color:#fff;border-color:rgba(255,255,255,.35);text-shadow:0 1px 1px rgba(60,80,65,.25)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:var(--lift-sm),0 0 0 2px rgba(147,173,152,.45),0 0 16px rgba(147,173,152,.55)}
h1{font-size:1.3rem;font-weight:700}
.sub{font-size:.85rem;color:var(--dim);margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.tab{padding:.5rem 1rem;border-radius:999px;border:1px solid #fff;background:var(--card-g);box-shadow:var(--lift-sm);cursor:pointer;font-size:.88rem;font-weight:600;text-decoration:none}
.tab.on{background:var(--soft);box-shadow:var(--sunk);color:var(--gold)}
.grid{columns:3 280px;column-gap:14px}
@media(max-width:560px){.grid{columns:2 150px;column-gap:10px}}
.ph{break-inside:avoid;margin:0 0 14px;border-radius:16px;overflow:hidden;background:var(--soft);box-shadow:var(--lift);border:4px solid var(--card);cursor:zoom-in;position:relative;display:block;width:100%;padding:0}
.ph img{width:100%;display:block;min-height:120px;background:var(--soft)}
.empty{text-align:center;padding:60px 10px;color:var(--dim)}
.hint{font-size:.82rem;color:var(--dim);margin-bottom:12px}
/* عارض الصورة الكاملة */
#lb{display:none;position:fixed;inset:0;z-index:100;background:rgba(30,26,23,.93);align-items:center;justify-content:center;flex-direction:column;touch-action:pan-y}
#lb.show{display:flex}
#lb img{max-width:96vw;max-height:84vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none}
#lb .bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;color:#f1ece6;font-size:.9rem}
#lb .bar .btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);box-shadow:none;color:#fff;padding:.5rem .9rem}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff;font-size:1.6rem;cursor:pointer;display:grid;place-items:center}
#lb .nav.prev{right:12px}
#lb .nav.next{left:12px}
#lb .cap{position:absolute;bottom:12px;color:#d9d1c8;font-size:.82rem}
.spin{position:absolute;color:#ddd;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">المزيد من الصور</h1>
      <div class="sub" id="count"></div>
    </div>
    <a class="btn pri" id="back" href="index.html">→ الرجوع إلى صفحة الحجز</a>
  </div>

  <div class="tabs" id="tabs" role="tablist" aria-label="أنواع التصوير"></div>
  <p class="hint">اضغط على أي صورة لعرضها بجودة عالية (أسهم الكيبورد أو السحب للتنقل · Esc للإغلاق).</p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>لا توجد صور لهذا النوع بعد.</div>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="عرض الصورة">
  <div class="bar">
    <button class="btn" id="lb-close" type="button">✕ إغلاق</button>
    <span id="lb-n"></span>
    <a class="btn" id="lb-back" href="index.html">→ صفحة الحجز</a>
  </div>
  <button class="nav prev" id="lb-prev" type="button" aria-label="السابق">›</button>
  <span class="spin" id="lb-spin">جارٍ التحميل…</span>
  <img id="lb-img" alt="">
  <button class="nav next" id="lb-next" type="button" aria-label="التالي">‹</button>
  <div class="cap" id="lb-cap"></div>
</div>

<script>
(function(){
const NAMES={weddings:'تصوير الأعراس',realestate:'تصوير منتجات وأطعمة',event:'تصوير إيفنت',montage:'مونتاج / تعديل',graduation:'حفل تخرج'};
const CP=window.CATEGORY_PHOTOS||{},V=window.THUMB_VERSION||'1';
const G=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key=new URLSearchParams(location.search).get('c');
if(!CP[key])key=Object.keys(CP)[0];
let list=[],cur=0;

// الصور: المصغّرة للشبكة (سريعة) و HD للعرض الكامل؛ والأصل احتياطيًا إن نقصت
const orig=(f,n)=>f+encodeURI(n);
const thumb=(f,n)=>'thumbs/'+f+encodeURI(n)+'.jpg?v='+V;
const hd=(f,n)=>'hd/'+f+encodeURI(n)+'.jpg?v='+V;

function render(){
  const c=CP[key]||{folder:'',photos:[]};
  list=(c.photos||[]).map(n=>({n,t:thumb(c.folder,n),h:hd(c.folder,n),o:orig(c.folder,n)}));
  G('title').textContent='المزيد من الصور — '+(NAMES[key]||'');
  G('count').textContent=list.length+' صورة';
  G('back').href='index.html?c='+encodeURIComponent(key);G('lb-back').href=G('back').href;
  G('tabs').innerHTML=Object.keys(CP).map(k=>`<a class="tab${k===key?' on':''}" role="tab" href="?c=${k}" data-k="${k}">${NAMES[k]||k}</a>`).join('');
  G('grid').innerHTML=list.map((p,i)=>`<button type="button" class="ph" data-i="${i}" aria-label="عرض الصورة ${i+1}"><img src="${p.t}" alt="من أعمال شعيب استوديو" loading="${i<6?'eager':'lazy'}" decoding="async" data-o="${p.o}"></button>`).join('');
  G('empty').hidden=list.length>0;
  document.querySelectorAll('#grid img').forEach(im=>im.addEventListener('error',()=>{if(!im.dataset.f){im.dataset.f=1;im.src=im.dataset.o}}));
}
G('tabs').addEventListener('click',e=>{
  const a=e.target.closest('[data-k]');if(!a)return;e.preventDefault();
  key=a.dataset.k;history.replaceState(null,'','?c='+key);render();
});

// ── العارض ──
const lb=G('lb'),img=G('lb-img');
function show(i){
  if(!list.length)return;
  cur=(i+list.length)%list.length;
  const p=list[cur];
  G('lb-spin').style.display='';img.style.opacity=.25;
  img.onload=()=>{G('lb-spin').style.display='none';img.style.opacity=1};
  img.onerror=()=>{ if(!img.dataset.f||img.dataset.f!==p.o){img.dataset.f=p.o;img.src=p.o}else{G('lb-spin').textContent='تعذّر تحميل الصورة'} };
  img.dataset.f='';img.src=p.h;
  G('lb-n').textContent=(cur+1)+' / '+list.length;
  G('lb-cap').textContent=NAMES[key]||'';
  // تحميل مسبق للمجاورتين لتنقّل سريع
  [cur+1,cur-1].forEach(j=>{const q=list[(j+list.length)%list.length];if(q){const x=new Image();x.src=q.h}});
}
function open(i){lb.classList.add('show');document.body.style.overflow='hidden';show(i)}
function close(){lb.classList.remove('show');document.body.style.overflow='';img.removeAttribute('src')}
G('grid').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)open(+b.dataset.i)});
G('lb-close').addEventListener('click',close);
G('lb-prev').addEventListener('click',()=>show(cur-1));
G('lb-next').addEventListener('click',()=>show(cur+1));
lb.addEventListener('click',e=>{if(e.target===lb)close()});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('show'))return;
  if(e.key==='Escape')close();
  else if(e.key==='ArrowRight')show(cur-1);   // RTL: اليمين = السابق
  else if(e.key==='ArrowLeft')show(cur+1);
});
let sx=null;
lb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)show(dx>0?cur-1:cur+1)},{passive:true});
render();
})();
</script>
</body>
</html>
