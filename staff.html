<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#efebe6">
<title>شعيب استوديو | جدول التصوير</title>
<script src="supabase-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
// تنسيق الوقت 12 ساعة: "17:05" ← "5:05 PM" (يُترك أي نص آخر كما هو)
function t12(v){var m=/^(\d{1,2}):(\d{2})/.exec(String(v==null?'':v).trim());if(!m)return v==null?'':String(v);var h=+m[1],ap=h>=12?'PM':'AM';h=h%12||12;return '‎'+h+':'+m[2]+' '+ap+'‎'}
function d12(d){d=new Date(d);return isNaN(d)?'':t12(d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'))}
try{if(!localStorage.getItem('ss_staff_auth'))document.documentElement.classList.add('locked')}catch(e){document.documentElement.classList.add('locked')}</script>
<style>
:root{
  /* نفس ثيم بقية الصفحات: Soft UI بيج · سيج · وردي (theme.js قد يستبدلها بألوان المالك) */
  --bg:#efebe6;--card:#ebe6df;--soft:#e4ded6;--line:#ddd5cb;
  --text:#5a524b;--dim:#8a8178;--gold:#9a6f66;--accent:#789680;--on-accent:#fff;--danger:#b86a63;
  --today:#b98b80;--mine:#789680;--mine-soft:rgba(120,150,128,.14);
  --sh-l:#ffffff;--sh-d:#d3cbc1;
  --lift:6px 6px 14px var(--sh-d),-6px -6px 14px var(--sh-l);
  --lift-sm:3px 3px 8px var(--sh-d),-3px -3px 8px var(--sh-l);
  --sunk:inset 3px 3px 7px #d6cec4,inset -3px -3px 7px #fbf9f6;
  --card-g:linear-gradient(145deg,#f4f0eb,#e7e1d9);
  --btn-sage:linear-gradient(145deg,#9fb8a4,#86a08b);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#f6f3ef 0%,#efebe6 55%,#e8e2db 100%) fixed;color:var(--text);padding:0 0 48px;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:#d9c7bf;color:#4a423b}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px}
h2{font-size:1.02rem;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 small{font-weight:500;color:var(--dim);font-size:.78rem}
.hint{font-size:.85rem;color:var(--dim);padding:10px 2px}
.panel{background:var(--card-g);border:1px solid rgba(255,255,255,.85);box-shadow:var(--lift);border-radius:20px;padding:18px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.55rem 1rem;border-radius:12px;background:var(--card-g);border:1px solid #fff;box-shadow:var(--lift-sm);color:var(--text);font-weight:600;font-size:.88rem;text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:var(--sunk)}
.btn.pri{background:var(--btn-sage);color:#fff;border:1px solid rgba(255,255,255,.35);text-shadow:0 1px 1px rgba(60,80,65,.25)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:var(--lift-sm),0 0 0 2px rgba(147,173,152,.45)}
.btn.sm{padding:.4rem .7rem;font-size:.8rem;border-radius:10px}
.ibtn{width:38px;height:38px;padding:0;border-radius:12px}
select{padding:.55rem .8rem;border-radius:12px;background:var(--soft);border:none;box-shadow:var(--sunk);min-width:150px}
select:focus,input:focus{outline:2px solid rgba(90,167,232,.55)}

/* ── الرأس ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.who{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:#fff;background:var(--btn-sage);box-shadow:var(--lift-sm);flex-shrink:0}
.who h1{font-size:1.2rem;font-weight:700;line-height:1.3}
.who small{display:block;font-size:.78rem;color:var(--dim);font-weight:500}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#status{font-size:.74rem;color:var(--dim)}

/* ── شريط النطاق (تصويراتي / الكل) ── */
.scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--soft);box-shadow:var(--sunk);gap:4px}
.seg button{border:0;background:none;padding:.5rem .95rem;border-radius:10px;font-weight:600;font-size:.88rem;color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--card-g);color:var(--text);box-shadow:var(--lift-sm)}

/* ── التصوير القادم (البطاقة الكبيرة) ── */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;cursor:pointer}
.hero-date{width:96px;text-align:center;border-radius:18px;padding:12px 6px;background:var(--btn-sage);color:#fff;box-shadow:var(--lift-sm)}
.hero-date b{display:block;font-size:2.2rem;line-height:1}
.hero-date span{display:block;font-size:.8rem;margin-top:4px;opacity:.95}
.hero-k{font-size:.78rem;color:var(--gold);font-weight:700;letter-spacing:.02em}
.hero h3{font-size:1.25rem;font-weight:700;margin:2px 0 8px;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--text)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.cd-big{display:inline-block;margin-top:10px;font-size:.82rem;font-weight:700;color:#fff;background:var(--today);border-radius:999px;padding:.25rem .8rem}
@media(max-width:560px){.hero{grid-template-columns:1fr}.hero-date{width:100%;display:flex;align-items:baseline;justify-content:center;gap:10px}.hero-date b{font-size:1.8rem}}

/* ── أرقام ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card-g);border:1px solid #fff;box-shadow:var(--lift-sm);border-radius:16px;padding:12px 14px}
.stat span{font-size:.76rem;color:var(--dim)}
.stat b{display:block;font-size:1.6rem;color:var(--gold);line-height:1.2}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ── شريط الأيام القادمة (14 يومًا) ── */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{height:6px}.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.dchip{flex:0 0 62px;scroll-snap-align:start;border:1px solid #fff;background:var(--card-g);box-shadow:var(--lift-sm);border-radius:14px;padding:8px 4px;text-align:center;position:relative}
.dchip small{display:block;font-size:.7rem;color:var(--dim)}
.dchip b{display:block;font-size:1.25rem;line-height:1.2}
.dchip i{display:block;font-style:normal;font-size:.68rem;color:var(--dim);margin-top:2px;min-height:1em}
.dchip.work{background:var(--btn-sage);color:#fff;border-color:transparent}
.dchip.work small,.dchip.work i{color:#fff}
.dchip.busy{box-shadow:var(--lift-sm),0 0 0 2px var(--mine) inset}
.dchip.today{outline:2px solid var(--today);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--dim);margin-top:2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* ── التبويبات ── */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:16px;background:var(--soft);box-shadow:var(--sunk);margin-bottom:16px;position:sticky;top:8px;z-index:5}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:.6rem .9rem;border-radius:12px;font-weight:600;font-size:.9rem;color:var(--dim);white-space:nowrap}
.tabs button.on{background:var(--card-g);color:var(--text);box-shadow:var(--lift-sm)}
.tabs .n{display:inline-block;min-width:20px;font-size:.72rem;background:var(--today);color:#fff;border-radius:999px;padding:0 6px;margin-inline-start:4px}

/* ── قائمة الجلسات (جدول الأعمال) ── */
.grp{margin-bottom:18px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;font-weight:700}
.grp-h small{color:var(--dim);font-weight:500;font-size:.8rem}
.grp-h .tag{font-size:.72rem;color:#fff;background:var(--today);border-radius:999px;padding:.05rem .55rem}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;text-align:start;border:1px solid #fff;background:var(--card-g);box-shadow:var(--lift-sm);border-radius:16px;padding:12px;margin-bottom:10px;transition:transform .15s}
.item:hover{transform:translateY(-1px)}
.item.mine{background:linear-gradient(145deg,#e3ede5,#d3e2d7);border-color:#fff;box-shadow:var(--lift-sm),inset -5px 0 0 var(--mine)}
.item.mine .tm{color:#4f6e57}
.item.mine .it-b b::after{content:'📸 عليك التصوير';display:inline-block;margin-inline-start:8px;font-size:.68rem;font-weight:700;color:#fff;background:var(--mine);border-radius:999px;padding:.08rem .55rem;vertical-align:middle}
.item.other{opacity:.9}
.up-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--dim);margin:0 2px 12px}
.up-legend span{display:inline-flex;align-items:center;gap:6px}
.up-legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.item.past{opacity:.82}
.tm{text-align:center;font-weight:700;font-size:.9rem;line-height:1.25}
.tm small{display:block;font-weight:500;font-size:.72rem;color:var(--dim)}
.it-b b{display:block;font-size:1rem;line-height:1.35}
.it-b .meta{font-size:.8rem;color:var(--dim);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:.74rem;padding:.12rem .55rem;border-radius:999px;background:var(--soft);box-shadow:var(--sunk)}
.chip.me{background:var(--mine);color:#fff;box-shadow:none}
.chip.role{background:var(--mine-soft);box-shadow:none;color:var(--text)}
.go{color:var(--dim);font-size:1.2rem}
@media(max-width:520px){.item{grid-template-columns:54px 1fr}.go{display:none}}

/* ── التقويم ── */
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.month{font-weight:700;min-width:130px;text-align:center;font-size:1.05rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wh{font-size:.72rem;color:var(--dim);text-align:center;padding:3px 0}
.cd{min-height:74px;border-radius:12px;background:var(--card);border:1px solid #fff;box-shadow:var(--lift-sm);padding:5px 6px;text-align:start;display:flex;flex-direction:column;gap:3px;overflow:hidden;position:relative}
.cd.off{background:none;border:0;box-shadow:none;cursor:default}
.cd.today{box-shadow:var(--lift-sm),0 0 0 2px var(--today) inset}
.cd.sel{background:#e4ded6;box-shadow:var(--sunk);border-color:transparent}
.cd.work{background:var(--mine-soft)}
.dn{font-size:.8rem;font-weight:700}
.ev{font-size:.66rem;line-height:1.25;background:var(--dim);color:#fff;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.ev.me{background:var(--mine)}
.cnt{position:absolute;top:4px;left:5px;font-size:.66rem;background:var(--today);color:#fff;border-radius:999px;padding:0 6px;font-weight:700}
@media(max-width:560px){.cd{min-height:54px;padding:4px}.ev{display:none}.cd.has::after{content:'';position:absolute;bottom:6px;inset-inline-start:50%;width:6px;height:6px;border-radius:50%;background:var(--dim);transform:translateX(50%)}.cd.work::after{background:var(--mine)}}

/* ── المهام ── */
.todo-grp{border:1px solid #fff;background:var(--card-g);box-shadow:var(--lift-sm);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.todo-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.todo-prog{font-size:.78rem;color:var(--gold);font-weight:700}
.todo-bar{height:6px;border-radius:999px;background:var(--soft);box-shadow:var(--sunk);overflow:hidden;margin-bottom:8px}
.todo-bar i{display:block;height:100%;background:var(--btn-sage);border-radius:999px;transition:width .25s}
.todo{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:.95rem}
.todo:hover{background:var(--soft)}
.todo input{width:20px;height:20px;accent-color:#789680;flex-shrink:0;cursor:pointer}
.todo.done span{text-decoration:line-through;color:var(--dim)}

/* ── التقرير ── */
.bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.bar label{font-size:.8rem;color:var(--dim);display:flex;flex-direction:column;gap:4px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:.5rem .6rem;border-bottom:1px solid var(--line);text-align:start}
th{font-size:.74rem;color:var(--dim);font-weight:600}
.scroll{overflow-x:auto}

/* ── نافذة تفاصيل الجلسة (المرجع الكامل) ── */
#modal{display:none;position:fixed;inset:0;z-index:90;align-items:center;justify-content:center;padding:16px;background:rgba(74,66,59,.45);backdrop-filter:blur(8px)}
#modal.show{display:flex}
.m-card{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid #fff;box-shadow:var(--lift);border-radius:22px}
.m-head{padding:20px 20px 16px;background:var(--btn-sage);color:#fff;border-radius:22px 22px 0 0;position:sticky;top:0;z-index:2;touch-action:none}
.m-grip{display:none;width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.7);margin:-8px auto 10px}
.m-head small{font-size:.8rem;opacity:.95}
.m-head h3{font-size:1.25rem;line-height:1.4;margin:4px 0 6px}
.m-head .when{display:inline-block;font-size:.78rem;font-weight:700;background:rgba(255,255,255,.22);border-radius:999px;padding:.15rem .7rem}
.m-x{position:absolute;top:12px;inset-inline-end:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.28);color:#fff;font-size:1.25rem;font-weight:700}
.m-close2{width:100%;margin-top:10px}
.m-body{padding:16px 20px 20px}
.m-sec{margin-bottom:16px}
.m-sec h4{font-size:.78rem;color:var(--dim);font-weight:600;margin-bottom:6px}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-box{background:var(--card-g);border:1px solid #fff;box-shadow:var(--lift-sm);border-radius:14px;padding:10px 12px}
.m-box span{display:block;font-size:.74rem;color:var(--dim)}
.m-box b{font-size:.98rem;font-weight:600}
.crew{display:flex;flex-direction:column;gap:6px}
.crew div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card-g);border:1px solid #fff;box-shadow:var(--lift-sm)}
.crew div.me{box-shadow:var(--lift-sm),inset -4px 0 0 var(--mine)}
.crew .a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;color:#fff;background:var(--dim);flex-shrink:0}
.crew .me .a{background:var(--mine)}
.crew small{color:var(--dim);font-size:.78rem;display:block}
.m-acts{display:flex;gap:8px;flex-wrap:wrap}
.m-acts .btn{flex:1 1 140px}
@media(max-width:560px){#modal{align-items:flex-end;padding:0}.m-card{border-radius:22px 22px 0 0;max-height:86vh;overscroll-behavior:contain;transition:transform .2s}.m-grip{display:block}.m-body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
html.m-open,html.m-open body{overflow:hidden}

/* ── شاشة الدخول ── */
#gate{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#f6f3ef 0%,#efebe6 55%,#e8e2db 100%)}
html.locked #gate{display:flex}
html.locked .wrap{display:none}
.gate-card{width:min(380px,100%);padding:30px 24px;border-radius:22px;background:var(--card-g);border:1px solid #fff;box-shadow:var(--lift);text-align:center}
.gate-card h1{margin-bottom:4px;font-size:1.3rem}
.gate-card p{font-size:.85rem;color:var(--dim);margin-bottom:16px}
.gate-card input{width:100%;margin-bottom:10px;padding:.75rem .9rem;border-radius:12px;border:none;background:var(--soft);box-shadow:var(--sunk)}
.gate-card .btn{width:100%;padding:.8rem}
#gate-names{width:100%;margin-bottom:10px;padding:.75rem .9rem;font-size:1rem;cursor:pointer}
#gate-type{background:none;border:0;color:var(--dim);font-size:.78rem;text-decoration:underline;margin-top:10px}
#gate-err{min-height:1.2rem;margin-top:8px;font-size:.82rem;color:var(--danger)}

[hidden]{display:none!important}
@media print{
  .noprint,.tabs,.scope,.top .tools{display:none !important}
  body{background:#fff;color:#000}
  .panel{border:0;box-shadow:none;padding:0}
  [data-view]:not(#v-rep){display:none!important}
  #v-rep{display:block!important}
}
</style>
<script src="theme.js"></script>
<script src="motion.js" defer></script>
</head>
<body>
<div id="gate" role="dialog" aria-modal="true" aria-label="تسجيل الدخول">
  <form class="gate-card" id="gate-form">
    <h1>شعيب استوديو</h1>
    <p>جدول التصوير للفريق — سجّل الدخول</p>
    <select id="gate-names" aria-label="اختر اسمك" hidden></select>
    <input id="gate-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" placeholder="اسم المستخدم" required>
    <input id="gate-pass" type="password" autocomplete="current-password" dir="ltr" placeholder="كلمة السر" required>
    <button class="btn pri" type="submit" id="gate-btn">دخول</button>
    <div id="gate-err" role="alert"></div>
    <button type="button" id="gate-type" hidden>كتابة اسم المستخدم بدلًا من ذلك</button>
  </form>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-label="تفاصيل التصوير">
  <div class="m-card" id="m-card"></div>
</div>

<div class="wrap">
  <header class="top">
    <div class="who">
      <div class="av" id="av" aria-hidden="true">📷</div>
      <div><h1 id="hello">جدول التصوير</h1><small id="status">شعيب استوديو</small></div>
    </div>
    <div class="tools noprint">
      <button class="btn ibtn" id="refresh" type="button" aria-label="تحديث" title="تحديث">↻</button>
      <button class="btn sm" id="logout" type="button">خروج</button>
    </div>
  </header>

  <div class="scope noprint">
    <div class="seg" role="group" aria-label="عرض">
      <button type="button" data-scope="me" id="sc-me">تصويراتي</button>
      <button type="button" data-scope="all" id="sc-all">كل الفريق</button>
    </div>
    <select id="f-ph" aria-label="مصوّر محدد"></select>
  </div>

  <section class="panel" id="next-panel"></section>

  <div class="stats" id="stats"></div>

  <section class="panel">
    <h2>🗓 الأيام القادمة <small>أسبوعان</small></h2>
    <div class="strip" id="strip"></div>
    <div class="legend" id="legend"></div>
  </section>

  <nav class="tabs noprint" role="tablist" id="tabs">
    <button type="button" role="tab" data-tab="up">📅 القادمة</button>
    <button type="button" role="tab" data-tab="cal">🗓 التقويم</button>
    <button type="button" role="tab" data-tab="past">🗂 السابقة</button>
    <button type="button" role="tab" data-tab="tasks">✅ المهام</button>
    <button type="button" role="tab" data-tab="rep">📊 التقرير</button>
  </nav>

  <section class="panel" data-view id="v-up"><div id="up-list"></div></section>

  <section class="panel" data-view id="v-cal" hidden>
    <div class="cal-bar">
      <button class="btn ibtn" id="prev" type="button" aria-label="الشهر السابق">›</button>
      <span class="month" id="month"></span>
      <button class="btn ibtn" id="next" type="button" aria-label="الشهر التالي">‹</button>
      <button class="btn sm" id="today" type="button">اليوم</button>
    </div>
    <div class="cal" id="cal"></div>
    <h2 id="day-title" style="margin-top:18px"></h2>
    <div id="day-list"></div>
  </section>

  <section class="panel" data-view id="v-past" hidden><div id="past-list"></div></section>

  <section class="panel" data-view id="v-tasks" hidden><div id="tasks"></div></section>

  <section class="panel" data-view id="v-rep" hidden>
    <h2>📊 تقرير عدد التصويرات</h2>
    <div class="bar noprint">
      <label>السنة <select id="r-y"></select></label>
      <label>الشهر <select id="r-m"></select></label>
      <button class="btn pri" id="print" type="button">🖨 طباعة</button>
    </div>
    <div id="r-body"></div>
  </section>
</div>

<script>
(function(){
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=id=>document.getElementById(id);
const now=new Date(),TD=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const AK='ss_staff_auth';
// اسم المستخدم → بريد Supabase (يُقبل البريد الكامل أيضًا)
const USERS={staff:'staff@shuaib-studio.com'};
// الحسابات الجديدة: من main.html → الإعدادات → الحسابات (جدول staff_accounts عبر rpc/staff_login)
// الحساب القديم في Supabase Auth يُستخدم فقط إن لم يُشغَّل supabase/staff_accounts.sql بعد
const digits=v=>String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
async function rpc(fn,body){
  const c=cfg();
  const r=await fetch(c.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===404){const e=new Error('missing');e.missing=true;throw e}
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
const toEmail=u=>{u=String(u||'').trim().toLowerCase();return u.includes('@')?u:(USERS[u]||u+'@shuaib-studio.com')};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};

let auth=null;try{auth=JSON.parse(localStorage.getItem(AK)||'null')}catch(e){}
let sessions=[],tasks={},team=[],loaded=false;
// ph = المصوّر المعروض ('' = كل الفريق). tab = التبويب الحالي.
const st={y:now.getFullYear(),m:now.getMonth()+1,sel:TD,ph:ls('ss_staff_ph'),tab:ls('ss_staff_tab')||'up',ry:now.getFullYear(),rm:now.getMonth()+1};
const cfg=()=>window.SB||{};

// ── Supabase (REST) ──
function saveAuth(a){auth=a;try{a?localStorage.setItem(AK,JSON.stringify(a)):localStorage.removeItem(AK)}catch(e){}lock()}
function lock(){document.documentElement.classList.toggle('locked',!auth)}
async function token(body,grant){
  const c=cfg();
  const r=await fetch(c.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.msg||'login failed');
  return {access:j.access_token,refresh:j.refresh_token,email:(j.user&&j.user.email)||''};
}
async function req(path,retry=true){
  const c=cfg();
  const r=await fetch(c.url+'/rest/v1/'+path,{headers:{apikey:c.key,Authorization:'Bearer '+auth.access}});
  if(r.status===401&&retry&&auth.refresh){
    try{saveAuth(await token({refresh_token:auth.refresh},'refresh_token'))}catch(e){saveAuth(null);throw e}
    return req(path,false);
  }
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
let lastSig='';
async function load(){
  if(!auth)return;
  try{
    let v;
    if(auth.tok){
      const j=await rpc('staff_sched',{p_tok:auth.tok});
      if(!j){saveAuth(null);sessions=[];loaded=false;G('gate-err').textContent='انتهت الجلسة أو تغيّرت كلمة السر — سجّل الدخول من جديد.';loadNames();return}
      v=j.value;if(j.name&&j.name!==auth.name){auth.name=j.name;saveAuth(auth)}
    }else{
      const rows=await req('staff_schedule?key=eq.sched&select=value');
      v=rows[0]&&rows[0].value;
    }
    sessions=((v&&v.sessions)||[]).filter(s=>s&&s.d);tasks=(v&&v.tasks)||{};team=(v&&v.team)||[];
    const first=!loaded;loaded=true;
    G('status').textContent='آخر تحديث '+d12(new Date());
    const sig=JSON.stringify(v||{});if(!first&&sig===lastSig)return;lastSig=sig;   // لا إعادة رسم بلا تغيير (حتى لا يقفز التمرير)
  }catch(e){G('status').textContent='⚠ تعذّر التحميل — تحقق من الإنترنت';}
  render();
}

// ── أدوات التاريخ ──
const dt=d=>new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8));
const iso=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
const addD=(d,n)=>{const x=dt(d);x.setDate(x.getDate()+n);return iso(x)};
const fmt=d=>`${+d.slice(8)} ${MON[+d.slice(5,7)-1]} ${d.slice(0,4)}`;
const fmtS=d=>`${+d.slice(8)} ${MON[+d.slice(5,7)-1]}`;
const wdOf=d=>WD[dt(d).getDay()];
const dl=d=>Math.round((dt(d)-dt(TD))/864e5);
const when=n=>n==0?'اليوم':n==1?'غدًا':n==2?'بعد يومين':n<0?(n==-1?'أمس':'قبل '+(-n)+(-n<=10?' أيام':' يومًا')):n<=10?'بعد '+n+' أيام':'بعد '+n+' يومًا';
const tRange=s=>s.t?t12(s.t)+(s.te?' – '+t12(s.te):''):'';
const byT=(a,b)=>(a.d+(a.t||'99'))<(b.d+(b.t||'99'))?-1:1;
const ini=n=>String(n||'?').trim().charAt(0)||'?';

// ── من أنا؟ (اسم الحساب المطابق لاسم في فريق العمل) ──
const norm=x=>String(x||'').trim().toLowerCase();
function me(){if(!auth||!auth.name)return '';const all=allNames();return all.find(n=>norm(n)===norm(auth.name))||''}
function allNames(){return [...new Set([...team,...sessions.flatMap(s=>s.ph||[])])].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'))}
function curPh(){if(st.ph==null){if(!loaded)return '';st.ph=me()}return st.ph||''}
const has=(s,n)=>(s.ph||[]).includes(n);
const list=()=>{const p=curPh();return sessions.filter(s=>!p||has(s,p)).sort(byT)};
const rolesOf=(s,n)=>((s.cr||[]).find(c=>c.p===n)||{}).r||[];
const tgt=()=>curPh()||me();   // المصوّر الذي تُميَّز جلساته بلون مختلف
const isMine=s=>{const t=tgt();return !!t&&has(s,t)};

// ── بطاقة جلسة في القوائم ──
function item(s,opt){
  const i=sessions.indexOf(s),p=curPh()||me(),r=p?rolesOf(s,p):[];
  const others=(s.ph||[]).filter(n=>n!==p);
  return `<button type="button" class="item${isMine(s)?' mine':(tgt()?' other':'')}${opt&&opt.past?' past':''}" data-s="${i}">
    <span class="tm">${s.t?esc(t12(s.t)).replace(' ','<small>')+'</small>':'<small>الوقت</small>—'}</span>
    <span class="it-b"><b>${esc(s.n||'بدون اسم')}</b>
      <span class="meta">${s.loc?`<span>📍 ${esc(s.loc)}</span>`:''}${s.te?`<span>⏱ حتى ${esc(t12(s.te))}</span>`:''}${s.pk?`<span>📦 ${esc(s.pk)}</span>`:''}</span>
      <span class="chips">${p&&has(s,p)?`<span class="chip me">${esc(p===me()?'أنت':p)}${r.length?' · '+r.map(esc).join('، '):''}</span>`:''}${others.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}${!(s.ph||[]).length?'<span class="chip">لم يُحدَّد المصورون</span>':''}</span>
    </span><span class="go" aria-hidden="true">‹</span></button>`;
}
// تجميع حسب اليوم
function grouped(L,opt){
  if(!L.length)return '';
  const g={};L.forEach(s=>(g[s.d]||(g[s.d]=[])).push(s));
  const keys=Object.keys(g).sort();if(opt&&opt.desc)keys.reverse();
  return keys.map(d=>{const n=dl(d);
    return `<div class="grp" id="g-${d}"><div class="grp-h">${wdOf(d)} ${fmtS(d)} <small>${d.slice(0,4)}</small>${n>=0&&n<=1?`<span class="tag">${when(n)}</span>`:`<small>· ${when(n)}</small>`}</div>${g[d].map(s=>item(s,opt)).join('')}</div>`}).join('');
}

// ── الرسم ──
function render(){
  if(!auth)return;
  const m=me(),p=curPh();
  // الرأس
  G('hello').textContent=m?'مرحبًا، '+m:(auth.name?'مرحبًا، '+auth.name:'جدول التصوير');
  G('av').textContent=m||auth.name?ini(m||auth.name):'📷';
  // النطاق
  const names=allNames();
  if(p&&!names.includes(p)&&loaded){st.ph='';}
  G('sc-me').hidden=!m;
  G('sc-me').classList.toggle('on',!!m&&p===m);G('sc-all').classList.toggle('on',!p);
  G('f-ph').innerHTML='<option value="">— مصوّر محدد —</option>'+names.map(n=>`<option value="${esc(n)}"${n===p&&n!==m?' selected':''}>${esc(n)}${n===m?' (أنت)':''}</option>`).join('');
  const L=list(),up=L.filter(s=>s.d>=TD),past=L.filter(s=>s.d<TD).reverse();
  const who=p?(p===m?'لك':'لـ'+p):'للفريق';
  // التصوير القادم
  const nx=up[0];
  G('next-panel').innerHTML=nx?`<div class="hero" data-s="${sessions.indexOf(nx)}" role="button" tabindex="0">
    <div class="hero-date"><b>${+nx.d.slice(8)}</b><span>${MON[+nx.d.slice(5,7)-1]} · ${wdOf(nx.d)}</span></div>
    <div><div class="hero-k">التصوير القادم ${esc(who)}</div><h3>${esc(nx.n||'بدون اسم')}</h3>
      <div class="meta">${nx.t?`<span>🕒 ${esc(tRange(nx))}</span>`:''}${nx.loc?`<span>📍 ${esc(nx.loc)}</span>`:''}${nx.pk?`<span>📦 ${esc(nx.pk)}</span>`:''}${p&&rolesOf(nx,p).length?`<span>🎬 ${rolesOf(nx,p).map(esc).join('، ')}</span>`:''}</div>
      <span class="cd-big">${countdown(nx)}</span></div></div>`
    :`<p class="hint" style="padding:4px 2px">${loaded?(p?'لا يوجد تصوير قادم '+esc(who)+' حاليًا. 🎉':'لا توجد تصويرات قادمة.'):'جارٍ التحميل…'}</p>`;
  // أرقام
  const wkEnd=addD(TD,6-dt(TD).getDay()),ym=TD.slice(0,7);   // نهاية الأسبوع = السبت
  const stat=(k,v)=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`;
  G('stats').innerHTML=stat('اليوم',up.filter(s=>s.d===TD).length)+stat('هذا الأسبوع',up.filter(s=>s.d<=wkEnd).length)+stat('هذا الشهر',L.filter(s=>s.d.slice(0,7)===ym).length)+stat('كل القادمة',up.length);
  // شريط 14 يومًا
  let sh='';for(let i=0;i<14;i++){const d=addD(TD,i),A=L.filter(s=>s.d===d),mine=m&&sessions.some(s=>s.d===d&&has(s,m));
    sh+=`<button type="button" class="dchip${A.length?(p?' work':' busy'):''}${!p&&mine?' work':''}${d===TD?' today':''}" data-day="${d}" aria-label="${wdOf(d)} ${fmtS(d)}${A.length?' — '+A.length+' تصوير':''}"><small>${i===0?'اليوم':i===1?'غدًا':wdOf(d)}</small><b>${+d.slice(8)}</b><i>${A.length?(A.length==1?'تصوير':A.length+' تصوير'):''}</i></button>`}
  G('strip').innerHTML=sh;
  G('legend').innerHTML=p?`<span><i style="background:var(--mine)"></i> يوم فيه تصوير ${esc(who)}</span><span><i style="outline:2px solid var(--today)"></i> اليوم</span>`
    :`${m?`<span><i style="background:var(--mine)"></i> يوم فيه تصوير لك</span>`:''}<span><i style="box-shadow:0 0 0 2px var(--mine) inset"></i> تصوير للفريق</span><span><i style="outline:2px solid var(--today)"></i> اليوم</span>`;
  // التبويبات
  G('tabs').querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===st.tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);
    const n=b.dataset.tab==='up'?up.length:0;b.innerHTML=b.innerHTML.replace(/<span class="n">.*<\/span>/,'')+(n?`<span class="n">${n}</span>`:'')});
  document.querySelectorAll('[data-view]').forEach(v=>v.hidden=v.id!=='v-'+st.tab);
  // «القادمة»: في «تصويراتي» أو مصوّر محدد ← جلساته فقط؛ في «كل الفريق» ← كل التواريخ وجلساتك بلون مختلف
  const upAll=p?up:sessions.filter(s=>s.d>=TD).sort(byT),T=tgt();
  G('up-list').innerHTML=upAll.length?(!p&&T?`<div class="up-legend"><span><i style="background:linear-gradient(145deg,#e3ede5,#d3e2d7);box-shadow:inset -3px 0 0 var(--mine)"></i> ${T===m?'تصويرك':'تصوير '+esc(T)}</span><span><i style="background:var(--card-g);box-shadow:var(--lift-sm)"></i> بقية الفريق</span></div>`:'')+grouped(upAll)
    :`<p class="hint">${loaded?'لا توجد تصويرات قادمة '+esc(who)+'.':'جارٍ التحميل…'}</p>`;
  G('past-list').innerHTML=past.length?grouped(past.slice(0,80),{past:1,desc:1})+(past.length>80?`<p class="hint">يُعرض آخر 80 تصويرًا — للباقي استخدم «التقرير».</p>`:''):`<p class="hint">${loaded?'لا توجد تصويرات سابقة.':'جارٍ التحميل…'}</p>`;
  calendar(L);taskList();report();
}
function countdown(s){
  const n=dl(s.d);
  if(n===0&&s.t){const [h,mi]=s.t.split(':').map(Number),t=new Date();t.setHours(h,mi,0,0);const mins=Math.round((t-new Date())/6e4);
    if(mins>60)return 'اليوم · بعد '+Math.floor(mins/60)+' س'+(mins%60?' و'+(mins%60)+' د':'');if(mins>0)return 'اليوم · بعد '+mins+' دقيقة';
    if(s.te){const [h2,m2]=s.te.split(':').map(Number),e=new Date();e.setHours(h2,m2,0,0);if(e<new Date())return 'اليوم · انتهى'}return 'اليوم · جارٍ الآن';}
  return when(n);
}

// ── التقويم ──
function calendar(L){
  const m=me(),ym=st.y+'-'+pad(st.m),lead=dt(ym+'-01').getDay(),nd=new Date(st.y,st.m,0).getDate(),by={};
  L.filter(s=>s.d.slice(0,7)==ym).forEach(s=>(by[s.d]||(by[s.d]=[])).push(s));
  G('month').textContent=MON[st.m-1]+' '+st.y;
  let c=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'].map(w=>`<div class="wh">${w}</div>`).join('')+'<div class="cd off"></div>'.repeat(lead);
  for(let d=1;d<=nd;d++){
    const k=ym+'-'+pad(d),A=by[k]||[],mine=A.some(s=>curPh()?true:(m&&has(s,m)));
    c+=`<button type="button" class="cd${A.length?' has':''}${mine?' work':''}${k==TD?' today':''}${k==st.sel?' sel':''}" data-day="${k}" aria-label="${d} ${MON[st.m-1]}${A.length?' — '+A.length+' تصوير':''}"><span class="dn">${d}</span>${A.slice(0,2).map(s=>`<i class="ev${(curPh()||(m&&has(s,m)))?' me':''}">${s.t?esc(t12(s.t))+' ':''}${esc(s.n||'—')}</i>`).join('')}${A.length>2?`<i class="ev">+${A.length-2}</i>`:''}${A.length?`<b class="cnt">${A.length}</b>`:''}</button>`;
  }
  G('cal').innerHTML=c;
  const day=L.filter(s=>s.d==st.sel);
  G('day-title').innerHTML=`${wdOf(st.sel)} ${fmt(st.sel)} <small>${when(dl(st.sel))}</small>`;
  G('day-list').innerHTML=day.length?day.map(s=>item(s,{past:s.d<TD})).join(''):`<p class="hint">لا توجد تصويرات في هذا اليوم.</p>`;
}

// ── المهام لكل مصوّر (يضيفها صاحب الاستوديو) ──
let done={};try{done=JSON.parse(ls('ss_todo_done')||'{}')}catch(e){}
function taskList(){
  const p=curPh(),e=Object.entries(tasks).filter(([n,a])=>(a||[]).length&&(!p||n===p));
  G('tasks').innerHTML=e.length?e.map(([n,a])=>{
    const k=i=>n+'|'+a[i],c=a.filter((_,i)=>done[k(i)]).length;
    return `<div class="todo-grp"><div class="todo-h"><b>${esc(n)}</b><span class="todo-prog" dir="ltr">${c} / ${a.length}</span></div><div class="todo-bar"><i style="width:${Math.round(c/a.length*100)}%"></i></div>`+
      a.map((x,i)=>`<label class="todo${done[k(i)]?' done':''}"><input type="checkbox" data-tk="${esc(k(i))}"${done[k(i)]?' checked':''}><span>${esc(x)}</span></label>`).join('')+`</div>`;
  }).join(''):`<p class="hint">${loaded?'لا توجد مهام'+(p?' لـ'+esc(p):'')+'.':'جارٍ التحميل…'}</p>`;
}
G('tasks').addEventListener('change',e=>{
  const c=e.target.closest('[data-tk]');if(!c)return;
  if(c.checked)done[c.dataset.tk]=1;else delete done[c.dataset.tk];
  ls('ss_todo_done',JSON.stringify(done));taskList();
});

// ── التقرير ──
function report(){
  const years=[...new Set([now.getFullYear(),st.ry,...sessions.map(s=>+s.d.slice(0,4))])].sort();
  G('r-y').innerHTML=years.map(y=>`<option value="${y}"${y==st.ry?' selected':''}>${y}</option>`).join('');
  G('r-m').innerHTML=`<option value="0"${st.rm==0?' selected':''}>كل السنة</option>`+MON.map((n,i)=>`<option value="${i+1}"${st.rm==i+1?' selected':''}>${n}</option>`).join('');
  const p=curPh(),L=list().filter(s=>+s.d.slice(0,4)==st.ry&&(!st.rm||+s.d.slice(5,7)==st.rm));
  const per=st.rm?MON[st.rm-1]+' '+st.ry:'سنة '+st.ry;
  const days=new Set(L.map(s=>s.d)).size,up=L.filter(s=>s.d>=TD).length;
  const by={};L.forEach(s=>(s.ph||[]).forEach(x=>by[x]=(by[x]||0)+1));
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const mm={};L.forEach(s=>{const k=+s.d.slice(5,7);mm[k]=(mm[k]||0)+1});
  G('r-body').innerHTML=
    `<p class="hint">${esc(per)}${p?' — المصوّر: '+esc(p):' — كل الفريق'}</p>`+
    `<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><span>عدد التصويرات</span><b>${L.length}</b></div><div class="stat"><span>أيام فيها تصوير</span><b>${days}</b></div><div class="stat"><span>القادمة منها</span><b>${up}</b></div></div>`+
    (!st.rm&&L.length?`<h2>حسب الشهر</h2><div class="scroll"><table><thead><tr><th>الشهر</th><th>عدد التصويرات</th></tr></thead><tbody>${Object.keys(mm).map(Number).sort((a,b)=>a-b).map(x=>`<tr><td>${MON[x-1]}</td><td>${mm[x]}</td></tr>`).join('')}</tbody></table></div>`:'')+
    (!p&&rows.length?`<h2 style="margin-top:14px">حسب المصوّر</h2><div class="scroll"><table><thead><tr><th>المصوّر</th><th>عدد التصويرات</th></tr></thead><tbody>${rows.map(([n,c])=>`<tr><td>${esc(n)}</td><td>${c}</td></tr>`).join('')}</tbody></table></div>`:'')+
    `<h2 style="margin-top:14px">قائمة التصويرات</h2>`+
    (L.length?`<div class="scroll"><table><thead><tr><th>#</th><th>التاريخ</th><th>الوقت</th><th>التصوير</th><th>المكان</th><th>المصورون</th></tr></thead><tbody>${L.map((s,i)=>`<tr><td>${i+1}</td><td>${wdOf(s.d)} ${fmt(s.d)}</td><td>${esc(tRange(s)||'—')}</td><td>${esc(s.n||'—')}${s.pk?' <small>('+esc(s.pk)+')</small>':''}</td><td>${esc(s.loc||'—')}</td><td>${(s.ph||[]).map(esc).join('، ')||'—'}</td></tr>`).join('')}</tbody></table></div>`:`<p class="hint">لا توجد تصويرات في هذه الفترة.</p>`);
}

// ── تفاصيل الجلسة: المرجع الكامل للمصوّر ──
const sKey=s=>s.id||(s.d+'|'+(s.t||'')+'|'+(s.n||''));
const maps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
function showDetails(s){
  const m=me(),n=dl(s.d),k=sKey(s);
  const crew=(s.cr&&s.cr.length?s.cr:(s.ph||[]).map(p=>({p,r:[]})));
  const box=(l,v)=>v?`<div class="m-box"><span>${l}</span><b>${v}</b></div>`:'';
  G('m-card').innerHTML=`<div class="m-head" id="m-head"><div class="m-grip" aria-hidden="true"></div><small>${wdOf(s.d)} · ${fmt(s.d)}</small><h3>${esc(s.n||'بدون اسم')}</h3><span class="when">${esc(n>=0?countdown(s):when(n))}</span><button class="m-x" type="button" id="m-close" aria-label="إغلاق">✕</button></div>
  <div class="m-body">
    <div class="m-sec"><div class="m-grid">
      ${box('🕒 الوقت',s.t?esc(tRange(s)):'غير محدد')}
      ${box('📦 الباقة',esc(s.pk||'—'))}
    </div></div>
    <div class="m-sec"><h4>📍 المكان</h4>${s.loc?`<div class="m-box" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><b>${esc(s.loc)}</b><a class="btn sm" href="${maps(s.loc)}" target="_blank" rel="noopener">🗺 الخريطة</a></div>`:`<p class="hint" style="padding:0">لم يُحدَّد المكان بعد — اسأل الإدارة.</p>`}</div>
    <div class="m-sec"><h4>👥 فريق التصوير (${crew.length})</h4>${crew.length?`<div class="crew">${crew.map(c=>`<div class="${c.p===m?'me':''}"><span class="a">${esc(ini(c.p))}</span><span><b>${esc(c.p)}${c.p===m?' (أنت)':''}</b>${c.r&&c.r.length?`<small>${c.r.map(esc).join('، ')}</small>`:''}</span></div>`).join('')}</div>`:`<p class="hint" style="padding:0">لم يُحدَّد المصورون بعد.</p>`}</div>
    ${(s.xs||[]).length?`<div class="m-sec"><h4>➕ خدمات إضافية مطلوبة</h4><div class="chips">${s.xs.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`:''}
    ${(s.eq||[]).length?`<div class="m-sec"><h4>🎒 المعدات</h4><div class="chips">${s.eq.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`:''}
    <div class="m-acts">
      <button class="btn pri" type="button" id="m-ics">📅 أضف إلى تقويم الجوال</button>
      <button class="btn" type="button" id="m-copy">📋 نسخ التفاصيل</button>
      <button class="btn" type="button" id="m-cal">🗓 عرض في التقويم</button>
    </div>
    <button class="btn m-close2" type="button" id="m-close2">إغلاق</button>
  </div>`;
  openM();
  G('m-close').onclick=closeM;G('m-close2').onclick=closeM;
  G('m-cal').onclick=()=>{closeM();st.tab='cal';ls('ss_staff_tab','cal');st.y=+s.d.slice(0,4);st.m=+s.d.slice(5,7);st.sel=s.d;render();setTimeout(()=>G('v-cal').scrollIntoView({behavior:'smooth',block:'start'}),120)};
  G('m-ics').onclick=()=>ics(s);
  G('m-copy').onclick=async()=>{const t=textOf(s);try{await navigator.clipboard.writeText(t);G('m-copy').textContent='✓ نُسخت'}catch(e){prompt('انسخ التفاصيل:',t)}};
}
// فتح/إغلاق النافذة: زر ✕ كبير ثابت أعلاها، زر «إغلاق» أسفلها، الضغط خارجها، Esc، زر الرجوع في الجوال، والسحب للأسفل
let mOpen=false;
function openM(){G('modal').classList.add('show');document.documentElement.classList.add('m-open');G('m-card').scrollTop=0;G('m-card').style.transform='';
  if(!mOpen){mOpen=true;try{history.pushState({ssm:1},'')}catch(e){}}}
function hideM(){G('modal').classList.remove('show');document.documentElement.classList.remove('m-open');G('m-card').style.transform='';mOpen=false}
const closeM=()=>{if(!mOpen)return hideM();if(history.state&&history.state.ssm){history.back()}else hideM()};
window.addEventListener('popstate',()=>{if(mOpen)hideM()});
(function(){let y0=null,dy=0;const C=G('m-card');
  C.addEventListener('touchstart',e=>{if(!e.target.closest('#m-head')&&C.scrollTop>0){y0=null;return}y0=e.touches[0].clientY;dy=0;C.style.transition='none'},{passive:true});
  C.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){C.style.transform='translateY('+dy+'px)';if(e.cancelable)e.preventDefault()}},{passive:false});
  C.addEventListener('touchend',()=>{if(y0==null)return;C.style.transition='';if(dy>90)closeM();else C.style.transform='';y0=null});
})();
function textOf(s){
  const crew=(s.cr&&s.cr.length?s.cr:(s.ph||[]).map(p=>({p,r:[]}))).map(c=>c.p+(c.r&&c.r.length?' ('+c.r.join('، ')+')':'')).join('، ');
  return ['📸 '+(s.n||'تصوير'),'📅 '+wdOf(s.d)+' '+fmt(s.d),s.t?'🕒 '+tRange(s).replace(/‎/g,''):'',s.loc?'📍 '+s.loc+'\n'+maps(s.loc):'',s.pk?'📦 '+s.pk:'',crew?'👥 '+crew:'',(s.eq||[]).length?'🎒 '+s.eq.join('، '):'',(s.xs||[]).length?'➕ '+s.xs.join('، '):''].filter(Boolean).join('\n');
}
function ics(s){
  const d=s.d.replace(/-/g,''),T=x=>x.replace(':','')+'00',e=x=>String(x||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  let a,b;
  if(s.t){a='DTSTART:'+d+'T'+T(s.t);let end=s.te;if(!end||end<=s.t){const [h,mi]=s.t.split(':').map(Number),x=Math.min(23*60+59,h*60+mi+120);end=pad(Math.floor(x/60))+':'+pad(x%60)}b='DTEND:'+d+'T'+T(end)}
  else{a='DTSTART;VALUE=DATE:'+d;b='DTEND;VALUE=DATE:'+addD(s.d,1).replace(/-/g,'')}
  const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shuaib Studio//Staff//AR','BEGIN:VEVENT','UID:'+e(sKey(s)).replace(/[^\w.-]/g,'')+'@shuaib-studio','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',a,b,'SUMMARY:'+e('📸 '+(s.n||'تصوير')),s.loc?'LOCATION:'+e(s.loc):'','DESCRIPTION:'+e(textOf(s)),'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:'+e(s.n||'تصوير'),'END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const url=URL.createObjectURL(new Blob([body],{type:'text/calendar;charset=utf-8'})),l=document.createElement('a');
  l.href=url;l.download='shoot-'+s.d+'.ics';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(url);l.remove()},500);
}

// ── الأحداث ──
const openS=e=>{const b=e.target.closest('[data-s]');if(!b)return false;const s=sessions[+b.dataset.s];if(s)showDetails(s);return true};
document.addEventListener('click',e=>{
  if(e.target.closest('#modal .m-card'))return;
  if(openS(e))return;
  const d=e.target.closest('[data-day]');
  if(d){st.sel=d.dataset.day;st.y=+st.sel.slice(0,4);st.m=+st.sel.slice(5,7);
    if(d.closest('#strip')){const has=list().some(s=>s.d===st.sel);if(has&&st.tab==='up'){render();const g=G('g-'+st.sel);if(g)g.scrollIntoView({behavior:'smooth',block:'start'});return}st.tab='cal';ls('ss_staff_tab','cal')}
    render();return}
  const t=e.target.closest('[data-tab]');if(t){st.tab=t.dataset.tab;ls('ss_staff_tab',st.tab);render();return}
  const sc=e.target.closest('[data-scope]');if(sc){st.ph=sc.dataset.scope==='me'?me():'';ls('ss_staff_ph',st.ph);render();return}
});
G('next-panel').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openS(e)}});
G('f-ph').addEventListener('change',e=>{st.ph=e.target.value||me()||'';ls('ss_staff_ph',st.ph);render()});
G('r-y').addEventListener('change',e=>{st.ry=+e.target.value;report()});
G('r-m').addEventListener('change',e=>{st.rm=+e.target.value;report()});
G('prev').addEventListener('click',()=>{st.m--;if(st.m<1){st.m=12;st.y--}render()});
G('next').addEventListener('click',()=>{st.m++;if(st.m>12){st.m=1;st.y++}render()});
G('today').addEventListener('click',()=>{st.y=now.getFullYear();st.m=now.getMonth()+1;st.sel=TD;render()});
G('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
G('print').addEventListener('click',()=>window.print());
G('refresh').addEventListener('click',()=>{lastSig='';load()});
G('logout').addEventListener('click',()=>{if(auth&&auth.tok)rpc('staff_logout',{p_tok:auth.tok}).catch(()=>{});saveAuth(null);sessions=[];loaded=false;lastSig='';st.ph=null;ls('ss_staff_ph',null);loadNames()});
G('gate-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=G('gate-btn'),err=G('gate-err');btn.disabled=true;err.textContent='';
  if(!cfg().key){err.textContent='لم يُضبط مفتاح Supabase (supabase-config.js).';btn.disabled=false;return}
  const u=G('gate-user').value.trim(),pw=digits(G('gate-pass').value);
  if(!u){err.textContent='اختر اسمك أولًا.';btn.disabled=false;return}
  try{
    let a=null,old=u.includes('@');
    if(!old)try{
      const j=await rpc('staff_login',{p_user:u.toLowerCase(),p_pass:pw});
      if(j&&j.locked){err.textContent='محاولات كثيرة خاطئة — حاول بعد 15 دقيقة.';btn.disabled=false;return}
      if(j&&j.token)a={tok:j.token,name:j.name||u};
    }catch(x){if(!x.missing)throw x;old=true}   // الدالة غير موجودة بعد → الحساب القديم
    if(!a&&old)a=await token({email:toEmail(u),password:pw},'password').catch(()=>null);
    if(!a)throw new Error('bad');
    st.ph=null;ls('ss_staff_ph',null);
    saveAuth(a);ls('ss_staff_last',u.toLowerCase());G('gate-pass').value='';err.textContent='';load();
  }catch(x){err.textContent='اسم المستخدم أو كلمة السر غير صحيحة.'}
  btn.disabled=false;
});
// شاشة الدخول: قائمة بأسماء الفريق (rpc/staff_login_names) — إن لم تتوفر يبقى حقل الكتابة
function pickName(u){G('gate-user').value=u;G('gate-names').value=u}
function typeMode(on){G('gate-names').hidden=on;G('gate-user').hidden=!on;G('gate-user').required=on;G('gate-type').hidden=on;if(on){G('gate-user').value='';G('gate-user').focus()}}
async function loadNames(){
  if(!cfg().key||auth)return;
  try{
    const L=await rpc('staff_login_names',{});if(!Array.isArray(L)||!L.length)return;
    const last=ls('ss_staff_last')||'';
    G('gate-names').innerHTML='<option value="" disabled selected>— اختر اسمك —</option>'+L.map(a=>`<option value="${esc(a.u)}">${esc(a.n||a.u)}</option>`).join('');
    typeMode(false);G('gate-user').value='';
    if(L.some(a=>a.u===last))pickName(last);
  }catch(e){}
}
G('gate-names').addEventListener('change',e=>{pickName(e.target.value);G('gate-err').textContent='';G('gate-pass').focus()});
G('gate-type').addEventListener('click',()=>typeMode(true));
// تحديث تلقائي: كل 15 ثانية والصفحة ظاهرة، وفورًا عند العودة للتبويب (لا يُعاد الرسم إن لم يتغيّر شيء)
window.addEventListener('focus',load);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth)load()});
setInterval(()=>{if(auth&&!document.hidden)load()},15000);
lock();render();if(auth)load();else loadNames();
})();
</script>
</body>
</html>
