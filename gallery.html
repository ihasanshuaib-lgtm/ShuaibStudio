<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>معرض ثلاثي الأبعاد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen dark stage with a 3D scene, one slim control bar at the bottom.
   Look: deliberately single-theme (dark), so photos carry all the color. */
:root {
  --bg: #131215;
  --ink: #efede8;
  --mute: #8d8a93;
  --line: #2c2a31;
  --accent: #7ccf8b;
  --on-accent: #0f1a12;
  --font-ui: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

.stage {
  flex: 1; min-height: 0; position: relative; overflow: hidden;
  perspective: 1500px; touch-action: none; cursor: grab; user-select: none;
  -webkit-user-select: none;
}
.stage.grab { cursor: grabbing; }
.scene { position: absolute; inset: 0; transform-style: preserve-3d; }
.card {
  position: absolute; left: 50%; top: 50%;
  width: var(--cw); height: var(--ch);
  margin-left: calc(var(--cw) / -2); margin-top: calc(var(--ch) / -2);
  background: #222; overflow: hidden; will-change: transform, opacity;
}
.card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
.morph, .morph .card { transition: transform .9s cubic-bezier(.16, .84, .3, 1), opacity .9s ease; }

.hint {
  position: absolute; top: 14px; left: 0; right: 0; text-align: center; z-index: 2;
  font-size: 12.5px; color: var(--mute); letter-spacing: .02em; pointer-events: none;
}
.drop {
  position: absolute; inset: 10px; z-index: 5; border: 1.5px dashed var(--accent);
  display: grid; place-items: center; background: rgba(19, 18, 21, .82);
  font-size: 18px; font-weight: 500; color: var(--accent);
}
.note {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4;
  background: var(--ink); color: var(--bg); padding: 8px 14px; font-size: 13px; font-weight: 500;
  max-width: 90%; text-align: center;
}

.bar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding-block: 14px 16px; direction: ltr; border-top: 1px solid var(--line);
}
.side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.left { justify-self: start; flex-wrap: wrap; }
.right { justify-self: end; gap: 12px; }
.tabs { display: flex; gap: 6px; }
.tab {
  font: 500 12.5px var(--font-mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--mute); background: transparent; border: 0; padding: 9px 12px; cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); outline: 2px solid var(--accent); outline-offset: 3px; }
.btn {
  font: 500 13px var(--font-ui); color: var(--ink); background: transparent;
  border: 1px solid var(--line); padding: 9px 14px; cursor: pointer; direction: rtl;
}
.btn:hover { border-color: var(--mute); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.count { font: 400 13px var(--font-mono); color: var(--mute); letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.arrow {
  width: 40px; height: 40px; display: grid; place-items: center; padding: 0;
  background: transparent; border: 1px solid var(--line); color: var(--ink); cursor: pointer;
}
.arrow:hover { border-color: var(--mute); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 760px) {
  .bar { grid-template-columns: 1fr auto; grid-template-areas: "tabs tabs" "left right"; row-gap: 10px; }
  .tabs { grid-area: tabs; justify-self: center; }
  .left { grid-area: left; }
  .right { grid-area: right; }
  .hint { font-size: 11.5px; }
}
@media (prefers-reduced-motion: reduce) { .morph, .morph .card { transition: none; } }
</style>

<div class="app">
  <div class="stage" id="stage">
    <div class="hint" id="hint">اسحب للتدوير · العجلة للتمرير · اضغط على صورة لإبرازها</div>
    <div class="scene" id="scene"></div>
    <div class="drop" id="drop" hidden>أفلت صورك هنا</div>
    <div class="note" id="note" role="status" hidden></div>
  </div>

  <footer class="bar">
    <div class="side left">
      <button class="btn primary" id="upload" type="button">إضافة صورك</button>
      <button class="btn" id="reset" type="button" hidden>الصور التجريبية</button>
      <button class="btn" id="auto" type="button" aria-pressed="true">إيقاف الحركة</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
    </div>
    <div class="tabs" role="tablist" aria-label="شكل العرض">
      <button class="tab" role="tab" data-mode="helix" type="button">Helix</button>
      <button class="tab" role="tab" data-mode="barrel" type="button">Barrel</button>
      <button class="tab" role="tab" data-mode="ring" type="button">Ring</button>
      <button class="tab" role="tab" data-mode="sphere" type="button">Sphere</button>
    </div>
    <div class="side right">
      <span class="count" id="count" dir="ltr">01 / 08</span>
      <button class="arrow" id="prev" type="button" aria-label="السابق">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <button class="arrow" id="next" type="button" aria-label="التالي">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 3 5 5-5 5"/></svg>
      </button>
    </div>
  </footer>
</div>

<script>
(function () {
  var MAX = 30, SPEED = 0.32;
  var stage = document.getElementById('stage'), scene = document.getElementById('scene');
  var countEl = document.getElementById('count'), noteEl = document.getElementById('note');
  var dropEl = document.getElementById('drop'), fileEl = document.getElementById('file');
  var resetBtn = document.getElementById('reset'), autoBtn = document.getElementById('auto');
  var tabs = [].slice.call(document.querySelectorAll('.tab'));
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var mode = 'helix', auto = !reduce, custom = false;
  var urls = [], cards = [], n = 0;
  var t = 0, target = 0, mx = 0, my = 0, tmx = 0, tmy = 0;
  var dragging = false, moved = 0, lastX = 0, downCard = null;
  var lastMove = 0, last = 0, lastIdx = -1, cw = 200, ch = 270, sw = 800, sh = 600;
  var morphTimer = 0, noteTimer = 0;

  /* ---------- sample images (generated, replaced by the user's own) ---------- */
  var PAL = ['#c5ead0', '#b8a5de', '#d98080', '#f4dc7c', '#7bd7e0', '#efbfa6', '#9fa9d9', '#eaa0a8'];
  function shade(hex, f) {
    var v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
    var m = f < 0 ? 0 : 255, p = Math.abs(f);
    r = Math.round(r + (m - r) * p); g = Math.round(g + (m - g) * p); b = Math.round(b + (m - b) * p);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function sample(i) {
    var W = 600, H = 800, c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d'), col = PAL[i % PAL.length];
    var g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, shade(col, 0.12)); g.addColorStop(1, shade(col, -0.12));
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(0,0,0,.16)'; x.beginPath(); x.ellipse(300, 650, 150, 18, 0, 0, 7); x.fill();
    var dark = shade(col, -0.45), mid = shade(col, -0.25), light = shade(col, 0.5);
    var k, r, q;
    switch (i % 8) {
      case 0:
        [[170, mid], [120, light], [70, dark]].forEach(function (s) { x.fillStyle = s[1]; x.beginPath(); x.arc(300, 400, s[0], 0, 7); x.fill(); });
        break;
      case 1:
        x.fillStyle = mid; x.beginPath(); x.moveTo(170, 640); x.lineTo(170, 360); x.arc(300, 360, 130, Math.PI, 0); x.lineTo(430, 640); x.closePath(); x.fill();
        x.fillStyle = light; x.beginPath(); x.moveTo(230, 640); x.lineTo(230, 380); x.arc(300, 380, 70, Math.PI, 0); x.lineTo(370, 640); x.closePath(); x.fill();
        break;
      case 2:
        x.save(); x.beginPath(); x.roundRect(190, 240, 220, 400, 40); x.clip();
        x.fillStyle = mid; x.fillRect(150, 200, 300, 460); x.strokeStyle = light; x.lineWidth = 26;
        for (k = -500; k < 600; k += 70) { x.beginPath(); x.moveTo(190 + k, 700); x.lineTo(190 + k + 460, 240); x.stroke(); }
        x.restore();
        break;
      case 3:
        x.fillStyle = mid; x.beginPath(); x.arc(300, 400, 170, -Math.PI / 2, Math.PI / 2);
        x.ellipse(300, 400, 90, 170, 0, Math.PI / 2, -Math.PI / 2, true); x.closePath(); x.fill();
        x.fillStyle = dark; x.beginPath(); x.arc(215, 330, 22, 0, 7); x.fill();
        break;
      case 4:
        x.fillStyle = mid; x.beginPath(); x.moveTo(300, 260); x.lineTo(460, 640); x.lineTo(140, 640); x.closePath(); x.fill();
        x.fillStyle = light; x.beginPath(); x.arc(300, 200, 44, 0, 7); x.fill();
        break;
      case 5:
        for (r = 0; r < 3; r++) for (q = 0; q < 3; q++) {
          x.fillStyle = (r + q) % 2 ? light : mid; x.beginPath(); x.arc(190 + q * 110, 290 + r * 130, 44, 0, 7); x.fill();
        }
        break;
      case 6:
        x.strokeStyle = mid; x.lineWidth = 56; x.beginPath(); x.arc(300, 400, 135, 0, 7); x.stroke();
        x.fillStyle = dark; x.beginPath(); x.arc(300, 400, 42, 0, 7); x.fill();
        break;
      default:
        [[200, 330, mid], [270, 400, dark], [340, 270, light]].forEach(function (b, j) {
          x.fillStyle = b[2]; x.beginPath(); x.roundRect(b[0] - 40 + j * 0, 640 - b[1], 80, b[1], 40); x.fill();
        });
        x.fillStyle = mid; x.beginPath(); x.roundRect(380, 400, 80, 240, 40); x.fill();
    }
    return c.toDataURL('image/jpeg', 0.86);
  }
  var samples = null;
  function getSamples() {
    if (!samples) { samples = []; for (var i = 0; i < 8; i++) samples.push(sample(i)); }
    return samples.slice();
  }

  /* ---------- cards ---------- */
  function build() {
    scene.innerHTML = ''; cards = []; n = urls.length;
    urls.forEach(function (u, i) {
      var d = document.createElement('div'); d.className = 'card'; d.dataset.i = i;
      var im = document.createElement('img'); im.src = u; im.alt = 'صورة ' + (i + 1); im.draggable = false;
      d.appendChild(im); scene.appendChild(d); cards.push(d);
    });
    lastIdx = -1;
  }
  function measure() {
    sw = stage.clientWidth; sh = stage.clientHeight;
    ch = Math.max(140, Math.min(sh * 0.56, sw * 0.62)); cw = ch * 0.75;
    stage.style.setProperty('--cw', cw + 'px'); stage.style.setProperty('--ch', ch + 'px');
  }
  function wrap(d) { var h = n / 2; return ((d + h) % n + n) % n - h; }
  function smooth(a, b, v) { var k = Math.min(1, Math.max(0, (v - a) / (b - a))); return k * k * (3 - 2 * k); }

  /* ---------- layouts ---------- */
  function apply() {
    if (!n) return;
    var step = Math.PI * 2 / n, rotY = mx * 14, rotX = -my * 9, i, d, a, tr, op, R, cs, sn;
    if (mode === 'barrel') {
      R = n < 3 ? cw * 1.2 : Math.max(cw * 1.2, (cw * 1.08) / (2 * Math.tan(Math.PI / n)));
      scene.style.transform = 'translateZ(' + (-R) + 'px) rotateX(' + (-8 + rotX) + 'deg) rotateY(' + rotY + 'deg)';
    } else if (mode === 'helix') {
      R = Math.max(cw * 1.15, cw * n / 7);
      scene.style.transform = 'translateZ(' + (-R) + 'px) rotateX(' + (-4 + rotX) + 'deg) rotateY(' + rotY + 'deg)';
    } else if (mode === 'sphere') {
      R = Math.max(cw * 1.45, cw * n / 5.5);
      scene.style.transform = 'translateZ(' + (-R) + 'px) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
    } else {
      R = Math.min(900, Math.max(380, sw * 0.5));
      scene.style.transform = 'translateY(' + (-sh * 0.05) + 'px) rotateX(' + (rotX * 0.5) + 'deg) rotateY(' + (rotY * 0.5) + 'deg)';
    }
    var dy = Math.min(ch * 0.3, (sh * 0.8) / n);
    for (i = 0; i < n; i++) {
      d = wrap(i - t); a = d * step; cs = Math.cos(a); sn = Math.sin(a);
      if (mode === 'barrel') {
        tr = 'rotateY(' + a + 'rad) translateZ(' + R + 'px)';
        op = 0.18 + 0.82 * Math.pow((cs + 1) / 2, 0.8);
      } else if (mode === 'helix') {
        tr = 'translateY(' + (d * dy) + 'px) rotateY(' + a + 'rad) translateZ(' + R + 'px)';
        op = (0.18 + 0.82 * Math.pow((cs + 1) / 2, 0.8)) * (1 - Math.pow(Math.abs(d) / (n / 2), 4));
      } else if (mode === 'sphere') {
        var lat = 0.62 * Math.sin(3 * a);
        tr = 'rotateY(' + a + 'rad) rotateX(' + lat + 'rad) translateZ(' + R + 'px) scale(.85)';
        op = 0.15 + 0.85 * Math.pow((cs * Math.cos(lat) + 1) / 2, 1.2);
      } else {
        tr = 'translate3d(' + (R * sn) + 'px,' + (R * (1 - cs)) + 'px,0) rotateZ(' + a + 'rad)';
        op = 1 - smooth(1.2, 2.1, Math.abs(a));
      }
      cards[i].style.transform = tr;
      cards[i].style.opacity = op.toFixed(3);
      cards[i].style.zIndex = Math.round((1 - Math.abs(d) / (n / 2)) * 100);
    }
    var idx = ((Math.round(t) % n) + n) % n;
    if (idx !== lastIdx) {
      lastIdx = idx;
      countEl.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');
    }
  }

  /* ---------- loop ---------- */
  function frame(now) {
    var dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    if (auto && !dragging) target += SPEED * dt;
    t += (target - t) * (1 - Math.exp(-dt * (dragging ? 18 : 6)));
    if (!reduce && now - lastMove > 2500 && !dragging) {
      tmx = Math.sin(now / 2600) * 0.45; tmy = Math.cos(now / 3100) * 0.3;
    }
    var k = 1 - Math.exp(-dt * 4);
    mx += (tmx - mx) * k; my += (tmy - my) * k;
    apply();
    requestAnimationFrame(frame);
  }

  /* ---------- controls ---------- */
  function setMode(m) {
    mode = m;
    tabs.forEach(function (b) { b.setAttribute('aria-selected', b.dataset.mode === m ? 'true' : 'false'); });
    scene.classList.add('morph'); clearTimeout(morphTimer);
    morphTimer = setTimeout(function () { scene.classList.remove('morph'); }, 950);
  }
  function say(msg) {
    noteEl.textContent = msg; noteEl.hidden = false; clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { noteEl.hidden = true; }, 3200);
  }
  function setAuto(v) {
    auto = v; autoBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
    autoBtn.textContent = v ? 'إيقاف الحركة' : 'تشغيل الحركة';
    if (!v) target = Math.round(target);
  }
  function step(dir) { target = Math.round(target) + dir; }
  function focusCard(i) { target += wrap(i - target); }
  function pps() { return Math.max(90, stage.clientWidth / (mode === 'ring' ? 3 : 5)); }

  tabs.forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  autoBtn.addEventListener('click', function () { setAuto(!auto); });

  stage.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    dragging = true; moved = 0; lastX = e.clientX; lastMove = performance.now();
    downCard = e.target.closest ? e.target.closest('.card') : null;
    stage.classList.add('grab');
  });
  window.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    tmx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
    tmy = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
    lastMove = performance.now();
    if (dragging) {
      var dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
      target -= dx / pps();
    }
  });
  function release() {
    if (!dragging) return;
    dragging = false; stage.classList.remove('grab');
    if (moved < 6 && downCard) focusCard(+downCard.dataset.i);
    else if (!auto) target = Math.round(target);
    downCard = null;
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  stage.addEventListener('wheel', function (e) {
    e.preventDefault(); target += (e.deltaY + e.deltaX) * 0.003;
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); setAuto(!auto); }
    else if (e.key >= '1' && e.key <= '4') setMode(tabs[+e.key - 1].dataset.mode);
  });
  window.addEventListener('resize', measure);
  if (window.ResizeObserver) new ResizeObserver(measure).observe(stage);

  /* ---------- uploads ---------- */
  function shrink(file) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var s = Math.min(1, 1000 / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.88));
      };
      im.onerror = function () { URL.revokeObjectURL(u); rej(); };
      im.src = u;
    });
  }
  async function addFiles(files) {
    var list = [].slice.call(files).filter(function (f) { return f.type.indexOf('image/') === 0; });
    if (!list.length) { say('اختر ملفات صور فقط'); return; }
    var out = [];
    for (var i = 0; i < list.length && out.length < MAX; i++) {
      try { out.push(await shrink(list[i])); } catch (err) { /* skip unreadable file */ }
    }
    if (!out.length) { say('تعذّر قراءة الصور، جرّب JPG أو PNG'); return; }
    if (!custom) { urls = []; custom = true; }
    urls = urls.concat(out).slice(-MAX);
    resetBtn.hidden = false; build(); target = Math.round(target);
    say('تمت إضافة ' + out.length + ' صورة، المجموع ' + urls.length);
  }
  document.getElementById('upload').addEventListener('click', function () { fileEl.click(); });
  fileEl.addEventListener('change', function () { if (fileEl.files.length) addFiles(fileEl.files); fileEl.value = ''; });
  resetBtn.addEventListener('click', function () {
    custom = false; urls = getSamples(); resetBtn.hidden = true; build();
  });
  var depth = 0;
  function hasFiles(e) { return e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], 'Files') > -1; }
  window.addEventListener('dragenter', function (e) { if (hasFiles(e)) { depth++; dropEl.hidden = false; } });
  window.addEventListener('dragleave', function (e) { if (hasFiles(e) && --depth <= 0) { depth = 0; dropEl.hidden = true; } });
  window.addEventListener('dragover', function (e) { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; dropEl.hidden = true; addFiles(e.dataTransfer.files);
  });

  /* ---------- start ---------- */
  urls = getSamples(); measure(); build(); setMode('helix'); setAuto(auto);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
